<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assessment Grader — Internal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
background:#eef1f6;color:#16223a;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:26px 20px 90px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(20,35,70,.10),0 8px 24px rgba(20,35,70,.06);
padding:32px;margin-bottom:18px}
h1{font-size:23px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
h2{font-size:17px;font-weight:700;margin-bottom:14px}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#5a6c8c;margin-bottom:10px}
p{margin-bottom:12px}
.sub{color:#5a6c8c;font-size:14px}
.brandbar{background:#1f3864;color:#fff;padding:20px 28px;border-radius:12px 12px 0 0;margin:-32px -32px 26px}
.brandbar h1{color:#fff;margin:0}.brandbar .sub{color:#b9c7e0;margin-top:4px}
label{display:block;font-size:13px;font-weight:600;color:#41516f;margin:16px 0 6px}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;padding:11px 13px;
border:1.5px solid #d3dbe8;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:#16223a}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2e5c9a;box-shadow:0 0 0 3px rgba(46,92,154,.12)}
textarea{min-height:150px;resize:vertical;line-height:1.6}
button{font-family:inherit;font-size:15px;font-weight:600;padding:12px 26px;border-radius:8px;border:none;
background:#1f3864;color:#fff;cursor:pointer;transition:.15s}
button:hover{background:#2e5c9a}button:disabled{background:#b6c1d4;cursor:not-allowed}
button.ghost{background:#fff;color:#1f3864;border:1.5px solid #cfd8e6}
button.ghost:hover{background:#f2f6fb}
button.skip{background:#fff;color:#8a6100;border:1.5px solid #e6c165;font-size:14px;padding:10px 18px}
button.skip:hover{background:#fff8e6}
.rule{border-top:1px solid #e6ebf3;margin:22px 0}
ul{margin:0 0 12px 20px}li{margin-bottom:6px}
.note{background:#fff8e6;border-left:3px solid #e0a800;padding:13px 16px;border-radius:0 8px 8px 0;font-size:14px;margin-bottom:16px}
.warn{background:#fdeded;border-left:3px solid #c0392b;padding:13px 16px;border-radius:0 8px 8px 0;font-size:14px}
.ok{background:#eaf6ee;border-left:3px solid #2e7d4f;padding:13px 16px;border-radius:0 8px 8px 0;font-size:14px}
.hdr{position:sticky;top:0;z-index:30;background:#1f3864;color:#fff;padding:11px 20px;
display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;background:rgba(255,255,255,.13);
padding:5px 13px;border-radius:6px}
.timer.low{background:#c0392b}
.calcbtn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:13px;font-weight:600;
padding:7px 14px;border-radius:6px;cursor:pointer}
.calcbtn:hover{background:rgba(255,255,255,.28)}
.bar{height:4px;background:#dbe2ec;position:sticky;top:46px;z-index:29}
.bar>div{height:100%;background:#2e5c9a;width:0;transition:width .25s}
.qmeta{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#7b8aa5;margin-bottom:12px}
.qtext{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:20px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid #dde4ee;border-radius:9px;
margin-bottom:9px;cursor:pointer;transition:.12s;font-size:15px}
.opt:hover{border-color:#9bb2d4;background:#f7faff}
.opt.sel{border-color:#1f3864;background:#eef3fb;box-shadow:0 0 0 2px rgba(31,56,100,.10)}
.opt .k{flex:none;width:24px;height:24px;border-radius:5px;background:#eef1f6;color:#5a6c8c;font-size:12px;
font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.sel .k{background:#1f3864;color:#fff}
.toggle{display:flex;gap:0;margin-bottom:18px;border:1.5px solid #d3dbe8;border-radius:9px;overflow:hidden}
.toggle div{flex:1;padding:11px 14px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;
color:#5a6c8c;background:#f7f9fc;transition:.12s;border-right:1.5px solid #d3dbe8}
.toggle div:last-child{border-right:none}
.toggle div:hover{background:#eef3fb}
.toggle div.on{background:#1f3864;color:#fff}
.toggle div .tag{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}
.toggle div.answered::after{content:" ✓";color:#2e7d4f;font-weight:700}
.toggle div.on.answered::after{color:#8fe0ad}
.wc{font-size:12px;color:#7b8aa5;text-align:right;margin-top:5px}
.wc.over{color:#c0392b;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#code{width:100%;height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
word-break:break-all;background:#f7f9fc}
/* calculator */
#calc{position:fixed;right:22px;bottom:22px;width:252px;background:#fff;border-radius:12px;z-index:60;
box-shadow:0 6px 32px rgba(15,25,50,.28);border:1px solid #d3dbe8;overflow:hidden}
#calc .ch{background:#1f3864;color:#fff;padding:8px 12px;font-size:12px;font-weight:700;
display:flex;justify-content:space-between;align-items:center;cursor:move;user-select:none}
#calc .ch span{cursor:pointer;font-size:16px;line-height:1;opacity:.8}
#calcdisp{padding:12px;text-align:right;font-size:24px;font-variant-numeric:tabular-nums;
font-family:ui-monospace,Menlo,Consolas,monospace;min-height:50px;word-break:break-all;background:#f7f9fc;
border-bottom:1px solid #e6ebf3}
#calchist{font-size:11px;color:#8a97ad;text-align:right;padding:0 12px 6px;min-height:15px;background:#f7f9fc}
#calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e6ebf3}
#calcpad button{background:#fff;border:none;padding:13px 0;font-size:16px;font-weight:600;color:#16223a;
border-radius:0;cursor:pointer}
#calcpad button:hover{background:#eef3fb}
#calcpad button.op{background:#f5f8fc;color:#2e5c9a}
#calcpad button.eq{background:#1f3864;color:#fff}
#calcpad button.eq:hover{background:#2e5c9a}
#calcpad button.fn{background:#f5f8fc;color:#8a6100;font-size:14px}
.hide{display:none}
@media print{body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
.noprint,#calc{display:none!important}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:6px}
.stat{background:#f5f8fc;border:1px solid #e2e9f3;border-radius:9px;padding:14px}
.stat .n{font-size:25px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#7b8aa5;font-weight:700;margin-top:2px}
.band{padding:16px 20px;border-radius:9px;font-size:19px;font-weight:700;text-align:center;margin:16px 0}
.b-go{background:#eaf6ee;color:#1d6b3f;border:1.5px solid #93cba9}
.b-mid{background:#fff6e0;color:#8a6100;border:1.5px solid #e6c165}
.b-no{background:#fdeded;color:#96271a;border:1.5px solid #e0a09a}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7b8aa5;
padding:8px 10px;border-bottom:2px solid #e2e9f3}
td{padding:10px;border-bottom:1px solid #eef1f6;vertical-align:top}
tr.wrong{background:#fdf4f3}tr.skip{background:#fffaf0}
.tick{font-weight:700;color:#2e7d4f}.cross{font-weight:700;color:#c0392b}.sk{font-weight:700;color:#c08a00}
.why{color:#5a6c8c;font-size:12.5px;margin-top:4px;font-style:italic}
.alt{color:#8a97ad;font-size:12px;margin-top:4px}
.sbar{height:8px;background:#e6ebf3;border-radius:4px;overflow:hidden;margin-top:6px}
.sbar>div{height:100%;border-radius:4px}
.wblock{border:1px solid #e2e9f3;border-radius:9px;padding:18px;margin-bottom:14px;background:#fafcff}
.wans{background:#fff;border:1px solid #e6ebf3;border-radius:7px;padding:14px;margin:10px 0;white-space:pre-wrap;font-size:14.5px}
.scorebtns{display:flex;gap:8px;flex-wrap:wrap}
.sb{padding:9px 18px;border:1.5px solid #cfd8e6;border-radius:7px;background:#fff;cursor:pointer;
font-weight:700;font-size:14px;color:#41516f}
.sb.on{background:#1f3864;color:#fff;border-color:#1f3864}
</style></head><body>
<div class="wrap">
<div id="in" class="card">
  <div class="brandbar"><h1>Assessment Grader</h1>
  <div class="sub">Internal use only — this file contains the answer key. Never send it to a candidate.</div></div>
  <div class="warn"><b>Do not forward this file.</b> Keep it where candidates cannot reach it.
  The candidate test file contains no answers; this one does.</div>
  <label>Upload the candidate's result file</label>
  <input type="file" id="file" accept=".txt,.json,text/plain" style="padding:9px">
  <div class="rule"></div>
  <label>…or paste the result code</label>
  <textarea id="paste" placeholder="Paste the long code here" style="min-height:110px;font-family:ui-monospace,monospace;font-size:11px"></textarea>
  <div class="rule"></div>
  <label>…or fetch live submissions from Supabase Database</label>
  <button type="button" class="ghost" id="fetchDbBtn" style="margin-top:6px">Fetch Submissions from Database</button>
  <div id="dbList" style="margin-top:14px"></div>
  <div class="rule"></div>
  <button id="go">Grade this assessment</button>
  <div id="err" style="margin-top:14px"></div>
</div>
<div id="out" class="hide"></div>
</div>
<script>
const KEY = {"intern": {"label": "Intern", "difficulty": "Foundational", "minutes": 30, "slots": {"Theoretical Knowledge": 4, "Calculation Capability": 6, "Strategic Mindset": 2, "Problem Solving Approach": 3}, "wslots": 2, "q": {"I01": {"id": "I01", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In Google Ads, at which level is the daily budget set?", "opts": ["Campaign", "Ad group", "Keyword", "Account"], "a": 0, "why": "Budget, bid strategy, location, schedule and network are all campaign-level settings.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I02": {"id": "I02", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In Meta Ads, which of these is decided at the AD SET level?", "opts": ["The campaign objective", "The audience and the optimisation event", "The payment method", "The creative and the headline"], "a": 1, "why": "Campaign = objective. Ad set = audience, placements, optimisation event, schedule. Ad = creative.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I03": {"id": "I03", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A user types 'best running shoes for flat feet' into Google. In Google Ads this is called:", "opts": ["A quality signal", "A keyword", "A search term", "An ad group theme"], "a": 2, "why": "A keyword is what you bid on. A search term is what the user actually typed. They are frequently different.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I04": {"id": "I04", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which campaign type CAPTURES existing demand rather than creating it?", "opts": ["Demand Gen", "YouTube in-stream video", "Display", "Search"], "a": 3, "why": "Search captures people already looking. Display, Video and Demand Gen interrupt people who were not.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I05": {"id": "I05", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Quality Score is made up of:", "opts": ["Expected CTR, ad relevance and landing page experience", "CTR, conversion rate and ROAS", "Account age, spend level and click volume", "Budget, bid and impressions"], "a": 0, "why": "Three components. None of them is how much you spend - a common misconception.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I06": {"id": "I06", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What does a negative keyword do?", "opts": ["Lowers your bid for that keyword", "Stops your ad showing for search terms containing that word", "Removes the keyword from your ad group", "Tells Google the keyword performed badly"], "a": 1, "why": "It is an exclusion, not a bid modifier.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I07": {"id": "I07", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which statement about EXACT match is true?", "opts": ["It always costs more per click than phrase match", "Your ad only shows for the exact words typed, in that exact order", "It can still match close variants such as plurals, misspellings and same-meaning phrasing", "It is only available on Shopping campaigns"], "a": 2, "why": "Exact match has not been literal for years. Close variants are why the search terms report still matters.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I08": {"id": "I08", "sec": "Theoretical Knowledge", "type": "mcq", "q": "On Meta, the campaign objective primarily determines:", "opts": ["Which placements are available", "How much you are charged per click", "The maximum budget you are allowed to set", "Who Meta shows the ad to and what outcome it optimises for"], "a": 3, "why": "The objective picks the optimisation model. Choosing Traffic to get cheap clicks is the classic error.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I19": {"id": "I19", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which of these is NOT something you set at the campaign level in Google Ads?", "opts": ["The ad headline", "Bid strategy", "Daily budget", "Target locations"], "a": 0, "why": "Headlines live on the ad. Everything else is campaign-level.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I20": {"id": "I20", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What is a conversion in Google Ads?", "opts": ["Any click on your ad", "An action you have defined as valuable and told Google to track", "A sale, and only a sale", "A visit to your website"], "a": 1, "why": "You define it. It might be a purchase, a form fill, a call or a booking - which is why definitions must be agreed with the client.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I21": {"id": "I21", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Phrase match will show your ad when the search term:", "opts": ["Is completely unrelated but popular", "Is longer than five words", "Contains the meaning of your keyword", "Contains your keyword's exact words in any order"], "a": 2, "why": "Phrase match covers searches that include the meaning of your keyword.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I22": {"id": "I22", "sec": "Theoretical Knowledge", "type": "mcq", "q": "On Meta, what is a 'placement'?", "opts": ["The country you are targeting", "The order in which your ads run", "The position of your ad in the auction", "The specific surface an ad appears on, such as Instagram Reels or Facebook Feed"], "a": 3, "why": "Feed, Reels, Stories, Marketplace, Audience Network and so on.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I23": {"id": "I23", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What is remarketing (or retargeting)?", "opts": ["Showing ads to people who have already interacted with your brand", "Rewriting an ad that performed badly", "Bidding on a competitor's brand name", "Running the same ad twice"], "a": 0, "why": "Warm audiences. Cheap conversions, but usually the least incremental spend in the account.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I24": {"id": "I24", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A landing page is:", "opts": ["The homepage of the website", "The page a user arrives on after clicking your ad", "The final page of a checkout process", "The page where you edit your ads"], "a": 1, "why": "It is part of the ad experience, and often where a campaign is actually failing.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I26": {"id": "I26", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In Google Ads, an 'impression' means:", "opts": ["Someone converted", "Your ad was approved", "Someone clicked your ad", "Your ad was shown"], "a": 3, "why": "Shown, not clicked. The distinction underpins CTR and CPM.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I27": {"id": "I27", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What is A/B testing?", "opts": ["Comparing two versions that differ by one variable, to see which performs better", "Testing an ad before it goes live", "Running the same ad to two different countries", "Running ads on two platforms at once"], "a": 0, "why": "One variable. Changing two things at once tells you nothing about which one worked.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "N22": {"id": "N22", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What is a 'bid' in an ad auction?", "opts": ["The amount you pay every time your ad is shown", "The maximum you are willing to pay for a click or an outcome", "The total budget for the campaign", "The price the platform charges for the ad slot"], "a": 1, "why": "A maximum, not a fixed price. You usually pay less than your bid.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "N23": {"id": "N23", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What does 'reach' mean, and how does it differ from impressions?", "opts": ["Reach counts only people who engaged with the ad", "They are the same thing", "Reach is the number of unique people; impressions is the number of times ads were shown", "Reach is clicks; impressions is views"], "a": 2, "why": "Impressions divided by reach gives frequency, which is why the distinction matters.", "track": "both", "cat": "Theoretical Knowledge", "diff": "low"}, "I09": {"id": "I09", "sec": "Calculation Capability", "type": "num", "q": "Spend 40,000. Clicks 800. What is the CPC?", "a": 50, "why": "CPC = cost / clicks = 40,000 / 800 = 50.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I10": {"id": "I10", "sec": "Calculation Capability", "type": "num", "q": "Clicks 1,000. Impressions 25,000. What is the CTR, as a percentage? (enter the number only)", "a": 4, "why": "CTR = clicks / impressions = 1,000 / 25,000 = 4%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I11": {"id": "I11", "sec": "Calculation Capability", "type": "num", "q": "Spend 60,000. Conversions 30. What is the CPA?", "a": 2000, "why": "CPA = cost / conversions = 60,000 / 30 = 2,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I12": {"id": "I12", "sec": "Calculation Capability", "type": "num", "q": "Spend 25,000. Revenue 100,000. What is the ROAS? (enter as a number, e.g. 3.5)", "a": 4, "why": "ROAS = revenue / cost = 100,000 / 25,000 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I13": {"id": "I13", "sec": "Calculation Capability", "type": "num", "q": "Clicks 500. Conversions 20. What is the conversion rate, as a percentage?", "a": 4, "why": "CVR = conversions / clicks = 20 / 500 = 4%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I14": {"id": "I14", "sec": "Calculation Capability", "type": "num", "q": "Spend 30,000. Impressions 20,000. What is the CPM?", "a": 1500, "why": "CPM = cost / impressions x 1,000 = 30,000 / 20,000 x 1,000 = 1,500. Forgetting the x1,000 is the usual slip.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I29": {"id": "I29", "sec": "Calculation Capability", "type": "num", "q": "Impressions 50,000. Clicks 1,500. What is the CTR, as a percentage?", "a": 3, "why": "1,500 / 50,000 = 3%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I30": {"id": "I30", "sec": "Calculation Capability", "type": "num", "q": "Spend 18,000. Conversions 12. What is the CPA?", "a": 1500, "why": "18,000 / 12 = 1,500.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I31": {"id": "I31", "sec": "Calculation Capability", "type": "num", "q": "Revenue 240,000. Spend 60,000. What is the ROAS?", "a": 4, "why": "240,000 / 60,000 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I32": {"id": "I32", "sec": "Calculation Capability", "type": "num", "q": "You spent 12,000 and got 300 clicks. What is the CPC?", "a": 40, "why": "12,000 / 300 = 40.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I33": {"id": "I33", "sec": "Calculation Capability", "type": "num", "q": "800 clicks and a 5% conversion rate. How many conversions?", "a": 40, "why": "800 x 0.05 = 40.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I34": {"id": "I34", "sec": "Calculation Capability", "type": "num", "q": "A product sells for 2,000 and you sold 45 units. What is the revenue?", "a": 90000, "why": "2,000 x 45 = 90,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I35": {"id": "I35", "sec": "Calculation Capability", "type": "num", "q": "CPC is 25 and you have a budget of 20,000. How many clicks can you expect?", "a": 800, "why": "20,000 / 25 = 800.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I36": {"id": "I36", "sec": "Calculation Capability", "type": "num", "q": "Last month CPA was 1,000. This month it is 1,250. What is the percentage increase?", "a": 25, "why": "(1,250 - 1,000) / 1,000 = 25%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "N09": {"id": "N09", "sec": "Calculation Capability", "type": "num", "q": "Impressions 50,000. CTR 2%. CVR 5%. How many leads do you get?", "a": 50, "why": "50,000 x 2% = 1,000 clicks. 1,000 x 5% = 50 leads.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "N10": {"id": "N10", "sec": "Calculation Capability", "type": "num", "q": "Your target CPL is 400 and your conversion rate is 5%. What is the maximum CPC you can afford?", "a": 20, "why": "Max CPC = target CPL x CVR = 400 x 0.05 = 20.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "N11": {"id": "N11", "sec": "Calculation Capability", "type": "num", "q": "You need 300 leads. CVR is 3% and CPC is 25. What total budget do you need?", "a": 250000, "why": "300 / 0.03 = 10,000 clicks. 10,000 x 25 = 250,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "N12": {"id": "N12", "sec": "Calculation Capability", "type": "num", "q": "Campaign A: CPC 18, CVR 6%. What is the CPL?", "a": 300, "why": "CPL = CPC / CVR = 18 / 0.06 = 300.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "low"}, "I25": {"id": "I25", "sec": "Strategic Mindset", "type": "mcq", "q": "Why do advertisers bid on their own brand name?", "opts": ["To improve their organic ranking", "Because it is required by Google", "To defend against competitors bidding on it and to control the message", "Because it is the only way to appear in search results"], "a": 2, "why": "Cheap and defensive - but it takes credit for demand that already existed, so report it separately.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "I28": {"id": "I28", "sec": "Strategic Mindset", "type": "mcq", "q": "Which of these would you expect to have the HIGHEST purchase intent?", "opts": ["Someone scrolling Instagram who sees a shoe ad", "Someone searching 'buy nike pegasus 41 size 9'", "Someone who visited a shoe blog last month", "Someone watching a YouTube video about running"], "a": 1, "why": "Intent is the core concept behind why search and social behave so differently.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "I38": {"id": "I38", "sec": "Strategic Mindset", "type": "mcq", "q": "Which pair of metrics tells you the MOST about whether a campaign is working?", "opts": ["CTR and CPC", "Frequency and CPM", "Impressions and reach", "CPA and conversion volume, against a target"], "a": 3, "why": "Everything else is a diagnostic. Only cost per outcome and volume answer 'is this working'.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N01": {"id": "N01", "sec": "Strategic Mindset", "type": "mcq", "q": "You have 10,000 to spend for a local dentist and one week to prove it works. Which is the best use of the money?", "opts": ["Put it into search ads for high-intent terms like 'dentist near me' in a tight radius", "Run Instagram brand awareness ads to build recognition first", "Spend it all on one day to get maximum visibility", "Split it across Google, Meta, YouTube and Display to see which works"], "a": 0, "why": "One week and a small budget means capturing existing demand, not creating it. Spreading thin learns nothing.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N02": {"id": "N02", "sec": "Strategic Mindset", "type": "mcq", "q": "A client sells a 200 product and a 40,000 product. Which needs the longer consideration period, and what does that mean for advertising?", "opts": ["The 200 one, because more people buy it", "The 40,000 one — expect more touchpoints before purchase and don't judge on last-click alone", "Both are the same; price does not affect the buying process", "The 40,000 one, so you should stop advertising it"], "a": 1, "why": "Price drives consideration length, which drives how many touches you need and how you should measure.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N03": {"id": "N03", "sec": "Strategic Mindset", "type": "mcq", "q": "Your ad is getting lots of clicks but the client says the enquiries are from the wrong city. What is the most likely cause?", "opts": ["The landing page is slow", "The ad copy is unclear", "The location targeting settings", "The budget is too high"], "a": 2, "why": "Geography problems are almost always a settings problem, not a creative one.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N04": {"id": "N04", "sec": "Strategic Mindset", "type": "mcq", "q": "A brand has no website, only a phone number. What should you optimise for?", "opts": ["Impressions, to build awareness", "Do not advertise until they build a website", "Website clicks", "Calls, using call ads and call tracking"], "a": 3, "why": "Optimise for the conversion the business can actually receive.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N05": {"id": "N05", "sec": "Strategic Mindset", "type": "mcq", "q": "Two campaigns have the same CPL. One brings enquiries that close at 20%, the other at 5%. What should you do?", "opts": ["Move budget towards the campaign that closes at 20%, because the real cost per customer is four times lower", "Pause both and rebuild", "Increase the budget on both equally", "Nothing — the CPL is the same, so they perform equally"], "a": 0, "why": "The cheapest lead is not the cheapest customer. This is the single most important idea in lead gen.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N06": {"id": "N06", "sec": "Strategic Mindset", "type": "mcq", "q": "A client wants to advertise on every platform at once with a small budget. Your advice:", "opts": ["Agree — more reach means more sales", "Start on one or two where their customers clearly are, learn what works, then expand", "Refuse the work", "Split the budget equally so nothing is missed"], "a": 1, "why": "A small budget spread across five platforms produces five inconclusive tests.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N07": {"id": "N07", "sec": "Strategic Mindset", "type": "mcq", "q": "Why might you deliberately spend MORE per click on one keyword than another?", "opts": ["You should always pay the same per click", "Because it has more search volume", "Because it converts better or brings higher-value customers, so it is worth more to you", "Because it is a longer phrase"], "a": 2, "why": "Value, not volume, justifies the bid. Understanding this early separates good juniors from average ones.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "N08": {"id": "N08", "sec": "Strategic Mindset", "type": "mcq", "q": "A campaign has been running for three days with 40 clicks and no conversions. The client wants to shut it down. What is the right response?", "opts": ["Ignore them and keep it running", "Double the budget to get results faster", "Agree — three days is enough to see it is not working", "Explain that 40 clicks is too small a sample to conclude anything, and agree what evidence would justify stopping"], "a": 3, "why": "Sample size, plus agreeing the stopping rule in advance instead of arguing about it later.", "track": "both", "cat": "Strategic Mindset", "diff": "low"}, "I15": {"id": "I15", "sec": "Problem Solving Approach", "type": "mcq", "q": "CPA has risen over the last month, but CPC has not changed. The most likely explanation is:", "opts": ["Impressions have dropped", "Competitors are bidding more aggressively", "The conversion rate has fallen", "Your budget is too low"], "a": 2, "why": "CPA = CPC / CVR. If CPC is flat and CPA rose, CVR must have fallen - so the problem is after the click.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I16": {"id": "I16", "sec": "Problem Solving Approach", "type": "mcq", "q": "Campaign A: 3 conversions, ROAS 9.0. Campaign B: 180 conversions, ROAS 3.2. What should you do?", "opts": ["Split the budget evenly between them", "Move most of the budget into Campaign A immediately", "Pause Campaign B", "Treat Campaign A's ROAS as unreliable - 3 conversions is too small a sample to act on"], "a": 3, "why": "Sample size before decision. Three conversions is noise, not evidence.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I17": {"id": "I17", "sec": "Problem Solving Approach", "type": "mcq", "q": "Conversions dropped to zero overnight with no change in spend or clicks. What do you check FIRST?", "opts": ["Whether the conversion tracking is still firing", "Whether you should raise bids", "Whether the season has changed", "Whether competitors have entered the auction"], "a": 0, "why": "Zero conversions with normal traffic is a tracking failure until proven otherwise. Always rule out measurement first.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I18": {"id": "I18", "sec": "Problem Solving Approach", "type": "mcq", "q": "You are given a task, the instructions are unclear, and your manager is in back-to-back meetings. Best action:", "opts": ["Guess and complete it so it is done on time", "Attempt it, note your specific questions and assumptions, and send one consolidated message", "Ask a different colleague to do it for you", "Wait until they are free so you do not get it wrong"], "a": 1, "why": "Attempt, document assumptions, ask once and precisely. This is the single most testable work-habit signal at intern level.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I37": {"id": "I37", "sec": "Problem Solving Approach", "type": "mcq", "q": "A campaign has a 12% CTR and another has 1.2%. What is the most likely explanation?", "opts": ["The first campaign has better images", "The first campaign has a much bigger budget", "The first is probably brand or high-intent search; the second is probably cold prospecting", "The second campaign is broken"], "a": 2, "why": "CTR is driven by intent and match between query and ad, not by quality in the abstract.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I39": {"id": "I39", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your CTR is high but you have no conversions at all. Where do you look first?", "opts": ["The landing page and whether conversion tracking is working", "Add more keywords", "Change the bidding strategy", "Increase the budget"], "a": 0, "why": "People are clicking, so the ad works. The failure is after the click - page, offer, or measurement.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I40": {"id": "I40", "sec": "Problem Solving Approach", "type": "mcq", "q": "You are asked to pull a report and you notice a number that looks wrong. You:", "opts": ["Fix it yourself without telling anyone", "Flag it, say what looks wrong and why, and ask before sending", "Remove that section quietly", "Send it anyway - it was not your job to check"], "a": 1, "why": "Noticing is good. Flagging it rather than hiding or ignoring it is the behaviour that matters.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I41": {"id": "I41", "sec": "Problem Solving Approach", "type": "mcq", "q": "You have been asked to learn a platform you have never used, starting Monday. What do you do first?", "opts": ["Ask a colleague to do the work for you", "Wait for formal training", "Read the official documentation and look at an existing account", "Watch as many YouTube videos as possible"], "a": 2, "why": "Official docs plus the real account beats scattered video. Look for a sequenced plan, not enthusiasm.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I42": {"id": "I42", "sec": "Problem Solving Approach", "type": "mcq", "q": "You finish your work at 5pm and nothing is urgent. The best use of the next hour is:", "opts": ["Look busy until everyone else leaves", "Start a large new project without telling anyone", "Leave immediately without saying anything", "Ask your manager if anyone needs help, or work on learning something relevant"], "a": 3, "why": "Offering help or self-directed learning. Performing busyness and disappearing silently are both weak signals.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I43": {"id": "I43", "sec": "Problem Solving Approach", "type": "mcq", "q": "A colleague points out a mistake in your work in front of the team. You:", "opts": ["Thank them, fix it, and check whether it happened anywhere else", "Say nothing and fix it later", "Ask them to raise things privately next time, and leave it there", "Explain why it was not really your fault"], "a": 0, "why": "Fixing it AND checking for the same error elsewhere is what separates accountability from compliance.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I44": {"id": "I44", "sec": "Problem Solving Approach", "type": "mcq", "q": "You do not understand something in a client call and everyone else seems to. You:", "opts": ["Nod along and look it up afterwards", "Ask the question, or note it and ask your manager immediately after", "Ignore it - it is probably not important", "Ask a colleague to explain during the call over chat"], "a": 1, "why": "Either is fine. Nodding along and hoping is how misunderstandings become client problems.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}, "I45": {"id": "I45", "sec": "Problem Solving Approach", "type": "mcq", "q": "Two tasks are both due today and you cannot finish both. You:", "opts": ["Do half of each", "Do the easier one so at least one is finished", "Tell your manager early, with a recommendation on which should slip and why", "Work late and do both badly"], "a": 2, "why": "Early communication plus a recommendation. Look for the recommendation - anyone can raise a problem.", "track": "both", "cat": "Problem Solving Approach", "diff": "low"}}, "written": {"IW1": {"id": "IW1", "type": "text", "q": "Tell us about something in marketing you taught yourself in the last three months, without anyone asking you to. What did you learn, where did you learn it, and what did you actually do with it?", "words": 150, "guide": "Specific, recent and verifiable, with a real application. The application is the point - consuming content is not learning. Score 3 if they name the source and what they did with it. Score 0-1 for 'I watch a lot of YouTube'.", "track": "both"}, "IW2": {"id": "IW2", "type": "text", "q": "Pick a product or app you use every day. Who is the customer, what would you write as a Google search ad headline (30 characters maximum), and what is the first thing you would test?", "words": 150, "guide": "Thinks about the customer before the ad. Headline is specific rather than a generic superlative, and within 30 characters. Names ONE testable variable and what result would tell them something. Structure of thinking beats polish.", "track": "both"}, "IW3": {"id": "IW3", "type": "text", "q": "Describe a time you had to figure something out with no one to ask. What was it, what did you try, and how did it turn out?", "words": 150, "guide": "Resourcefulness and sequence. Look for what they actually tried, in order, and whether they knew when to stop. A failed attempt described honestly scores higher than a vague success.", "track": "both"}, "IW4": {"id": "IW4", "type": "text", "q": "Look at any brand's Instagram or Google ads that you have seen recently. What do you think they are trying to achieve, who is it aimed at, and what would you change?", "words": 150, "guide": "Tests whether they observe advertising critically at all. Strong answers infer the objective from the ad's construction. Weak answers comment on whether they personally liked it.", "track": "both"}}}, "associate": {"label": "Associate", "difficulty": "Intermediate", "minutes": 40, "slots": {"Theoretical Knowledge": 5, "Calculation Capability": 5, "Strategic Mindset": 3, "Problem Solving Approach": 5}, "wslots": 3, "q": {"A01": {"id": "A01", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Shared negative keyword lists are best used for:", "opts": ["Competitor brand names only", "Every negative you ever find, to keep things in one place", "Account-wide irrelevant themes applied across many campaigns", "Negatives that only apply to a single ad group"], "a": 2, "why": "Shared lists for account-wide junk. Campaign level for intent tiering. Ad group level for cross-negation.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A03": {"id": "A03", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Ad Rank is determined by:", "opts": ["Bid, ad quality, Ad Rank thresholds, auction context and expected impact of assets", "Quality Score multiplied by daily budget", "Click-through rate and account spend history", "Your maximum bid alone"], "a": 0, "why": "Relevance lowers your actual CPC, not just your position. 'Highest bid wins' is the classic wrong answer.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A04": {"id": "A04", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Search Lost IS (budget) of 45% means:", "opts": ["45% of your clicks were wasted", "You lost 45% of available impressions because the campaign was limited by budget", "Your budget is 45% higher than it needs to be", "45% of competitors outranked you"], "a": 1, "why": "Distinguishing lost IS (budget) from lost IS (rank) tells you whether the constraint is money or quality.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A05": {"id": "A05", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A responsive search ad allows a maximum of:", "opts": ["20 headlines and 4 descriptions", "10 headlines and 2 descriptions", "15 headlines and 4 descriptions", "5 headlines and 5 descriptions"], "a": 2, "why": "15 and 4. Worth knowing because the practical skill is writing 15 genuinely distinct angles, not 15 rewordings.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A06": {"id": "A06", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Pinning a headline to position 1:", "opts": ["Has no effect on delivery", "Is required for all brand campaigns", "Guarantees a higher Quality Score", "Reduces the number of ad combinations Google can test"], "a": 3, "why": "Pinning trades testing surface for control. Use it for legal or brand requirements, not as a default habit.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A07": {"id": "A07", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A campaign with a 5,000 daily budget spent 6,200 yesterday. This is:", "opts": ["Normal - Google can overdeliver on a given day but caps at the monthly charging limit", "A sign the bid strategy is broken", "Only possible if someone changed the budget", "An error you should report to the client immediately"], "a": 0, "why": "Average daily budget x 30.4 is the monthly cap. Daily overspend is expected and self-corrects.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A09": {"id": "A09", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Meta's learning phase typically exits after approximately:", "opts": ["7 days regardless of volume", "100 clicks per ad set", "50 optimisation events per ad set per week", "1,000 impressions per ad"], "a": 2, "why": "~50 events per ad set per week. This is why splitting a small budget across many ad sets fails.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A10": {"id": "A10", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which of these resets the Meta learning phase?", "opts": ["Any change to the campaign name", "Viewing the ad set in Ads Manager", "Adding a new comment reply", "A significant edit to the ad set's budget, audience or optimisation event"], "a": 3, "why": "Meaningful edits reset learning. Daily tinkering is why some accounts never stabilise.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A11": {"id": "A11", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The Conversions API is used to:", "opts": ["Send events server-side alongside the pixel, deduplicated using a shared event ID", "Import Google Ads conversions into Meta", "Automatically create lookalike audiences", "Replace the pixel entirely"], "a": 0, "why": "Alongside, not instead of. The shared event_id is what prevents double counting.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A12": {"id": "A12", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Event Match Quality measures:", "opts": ["How relevant your creative is to the audience", "How well the customer information you send matches Meta users", "How many conversions an ad set produced", "The quality score of your landing page"], "a": 1, "why": "Low EMQ means Meta cannot attribute or optimise properly. Fixed by passing more hashed parameters.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A13": {"id": "A13", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Advantage+ placements are generally recommended because:", "opts": ["They guarantee a lower CPA", "They only show ads on Facebook and Instagram feeds", "They let Meta find cheaper inventory across all available placements", "They exclude Audience Network by default"], "a": 2, "why": "Restricting placements restricts the auction. Exclude only with placement-level evidence, not on reputation.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A19": {"id": "A19", "sec": "Theoretical Knowledge", "type": "mcq", "q": "GA4 consistently reports fewer conversions than Google Ads. The most likely reason is:", "opts": ["They use different attribution models and different date logic", "The GA4 tag is broken", "Someone applied a filter in GA4", "Google Ads is inflating the numbers deliberately"], "a": 0, "why": "Ads reports on click date with data-driven attribution; GA4 is session-based, last-non-direct-click. They should not match.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A20": {"id": "A20", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Why should you not make decisions on yesterday's performance today?", "opts": ["The data refreshes only once a week", "Conversion lag - conversions are reported back to the click date, so recent days always understate", "Google randomises recent data to prevent manipulation", "Yesterday's data is always inaccurate"], "a": 1, "why": "Exclude the last 3-7 days depending on the account's measured lag, and agree that convention with the client.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M06": {"id": "M06", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Custom labels in a product feed exist to:", "opts": ["Replace the product_type attribute", "Add promotional text to the listing", "Improve the product's search ranking", "Segment products by business logic such as margin, price band, bestseller or seasonality"], "a": 3, "why": "They are how you make bidding follow profit rather than revenue.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M11": {"id": "M11", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Meta's default attribution setting is:", "opts": ["7-day click and 1-day view", "28-day click and 28-day view", "Last click across all channels", "1-day click only"], "a": 0, "why": "7-day click / 1-day view. Comparing it to a last-click backend is comparing two different questions.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M12": {"id": "M12", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The correct way to run a split test on Meta is:", "opts": ["Duplicate the ad set and change one variable", "Use the A/B test tool, which splits users rather than ad sets", "Run the variants in different weeks and compare", "Run both in the same ad set and compare ad-level data"], "a": 1, "why": "Duplicating creates auction overlap and unequal delivery, so the result is not attributable to the variable.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M14": {"id": "M14", "sec": "Theoretical Knowledge", "type": "mcq", "q": "An ad account gets restricted. The one thing you should NOT do is:", "opts": ["Submit a request for review", "Read the specific policy cited", "Audit the landing page for the violation", "Create a replacement ad account or Business Manager"], "a": 3, "why": "Spinning up a new asset risks the entire Business Manager being flagged.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A25": {"id": "A25", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which negative keyword match type would stop your ad for the search 'free crm software'?", "opts": ["Negative exact 'free'", "Negative phrase 'software free'", "None of these", "Negative broad 'free'"], "a": 3, "why": "Negative broad on 'free' blocks any search containing that word. Negative exact only blocks the term 'free' alone.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A26": {"id": "A26", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Auction Insights tells you:", "opts": ["Which domains you compete with, and their impression share, overlap rate and outranking share", "Your competitors' conversion rates", "The exact position your ad appeared in", "What your competitors are bidding"], "a": 0, "why": "Never their bids or their results - only relative auction presence.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A27": {"id": "A27", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A 'close variant' means Google may show your ad for a search that:", "opts": ["Is in a different language", "Has the same meaning as your keyword, including misspellings and plurals", "Contains any word from your keyword", "Is in a different country"], "a": 1, "why": "Which is why exact match is not literal and why the search terms report still matters.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A28": {"id": "A28", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In Meta, what does 'frequency' measure?", "opts": ["How often the algorithm updates delivery", "How often you refresh your creative", "Average number of times each person saw your ad", "How many ads are running in an ad set"], "a": 2, "why": "Impressions / reach. Rising frequency with falling CTR is the classic fatigue signature.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A29": {"id": "A29", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which Meta objective would you use to drive purchases on a website?", "opts": ["Awareness", "Traffic", "Engagement", "Sales"], "a": 3, "why": "Sales, optimising for the purchase event. Traffic buys cheap clicks from people who do not buy.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A30": {"id": "A30", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What is a customer match (or customer list) audience?", "opts": ["An audience built by uploading your own hashed customer data", "Anyone who has visited your website", "People who match your ideal customer profile demographically", "An audience Google builds from similar advertisers"], "a": 0, "why": "Your first-party data, hashed before upload. Increasingly the most valuable targeting asset you have.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A32": {"id": "A32", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In Google Ads, what does a 'Limited by budget' status mean?", "opts": ["The bid strategy has been paused", "The campaign has spent its lifetime budget", "The campaign could get more impressions if the budget were higher", "The account payment method has failed"], "a": 2, "why": "It is an opportunity flag, not an error - but only worth acting on if the campaign is hitting its efficiency target.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A34": {"id": "A34", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Dynamic product ads on Meta require, at minimum:", "opts": ["A synced catalog and pixel/CAPI events passing matching content IDs", "A minimum of 1,000 products", "A separate Business Manager", "A video creative for each product"], "a": 0, "why": "The content_id link between catalog and pixel is what makes them dynamic. It is also what most often breaks.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M28": {"id": "M28", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In a Shopping campaign, what actually determines which searches your product shows for?", "opts": ["The landing page content", "The keywords in the ad group", "The product feed data, primarily the title, attributes and category", "The campaign priority setting"], "a": 2, "why": "The feed is the targeting mechanism. This is why title optimisation is the highest-leverage Shopping lever.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M36": {"id": "M36", "sec": "Theoretical Knowledge", "type": "mcq", "q": "An account has data-driven attribution and a 30-day conversion window. A client asks why last week's ROAS keeps changing. The answer is:", "opts": ["The currency conversion updates daily", "The platform is unreliable", "Conversions are credited back to the click date, so recent days fill in over time", "Someone is editing the campaigns"], "a": 2, "why": "Back-filling is expected. Agreeing a reporting lag convention up front prevents this conversation entirely.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M48": {"id": "M48", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which is the best evidence that a landing page change worked?", "opts": ["Bounce rate fell", "Conversion rate went up the following week", "A controlled split test with adequate conversion volume showed a lift", "The client prefers the new page"], "a": 2, "why": "Week-on-week movement confounds with traffic mix, seasonality and everything else that changed.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A15": {"id": "A15", "sec": "Calculation Capability", "type": "num", "q": "Spend 250,000. Conversions 200. Revenue 900,000. What is the ROAS?", "a": 3.6, "why": "900,000 / 250,000 = 3.6.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A16": {"id": "A16", "sec": "Calculation Capability", "type": "num", "q": "CPC is 40 and conversion rate is 2.5%. What is the CPA?", "a": 1600, "why": "CPA = CPC / CVR = 40 / 0.025 = 1,600.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A17": {"id": "A17", "sec": "Calculation Capability", "type": "num", "q": "You need 100 leads at a target CPL of 800. What budget do you need?", "a": 80000, "why": "100 x 800 = 80,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A18": {"id": "A18", "sec": "Calculation Capability", "type": "num", "q": "CPM is 300 and CTR is 1.5%. What is the CPC?", "a": 20, "why": "CPC = CPM / (1,000 x CTR) = 300 / (1,000 x 0.015) = 20.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M17": {"id": "M17", "sec": "Calculation Capability", "type": "num", "q": "A client wants 40 sales a month. Close rate is 25% and lead-to-SQL is 40%. How many leads are needed per month?", "a": 400, "why": "40 / 0.25 = 160 SQLs. 160 / 0.40 = 400 leads.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M18": {"id": "M18", "sec": "Calculation Capability", "type": "num", "q": "Same client: target CAC is 12,000 and 400 leads are needed. What CPL do you need?", "a": 1200, "why": "Budget = 40 x 12,000 = 480,000. CPL = 480,000 / 400 = 1,200.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M19": {"id": "M19", "sec": "Calculation Capability", "type": "num", "q": "Backend revenue is 8,000,000 and total ad spend across all channels is 2,500,000. What is the MER?", "a": 3.2, "why": "MER = total revenue / total ad spend = 3.2. Platform-agnostic, so immune to cross-channel double counting.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A35": {"id": "A35", "sec": "Calculation Capability", "type": "num", "q": "Spend 180,000. Revenue 630,000. What is the ROAS?", "a": 3.5, "why": "630,000 / 180,000 = 3.5.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A36": {"id": "A36", "sec": "Calculation Capability", "type": "num", "q": "You need 250 conversions and your CVR is 4%. How many clicks do you need?", "a": 6250, "why": "250 / 0.04 = 6,250.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A37": {"id": "A37", "sec": "Calculation Capability", "type": "num", "q": "6,250 clicks at a CPC of 32. What budget do you need?", "a": 200000, "why": "6,250 x 32 = 200,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A38": {"id": "A38", "sec": "Calculation Capability", "type": "num", "q": "CPA is 1,600 and AOV is 4,800. What is the ROAS?", "a": 3, "why": "ROAS = AOV / CPA = 4,800 / 1,600 = 3.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A39": {"id": "A39", "sec": "Calculation Capability", "type": "num", "q": "Impressions 400,000. Reach 100,000. What is the frequency?", "a": 4, "why": "400,000 / 100,000 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A40": {"id": "A40", "sec": "Calculation Capability", "type": "num", "q": "Spend 90,000 at a CPM of 450. How many impressions?", "a": 200000, "why": "90,000 / 450 x 1,000 = 200,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A41": {"id": "A41", "sec": "Calculation Capability", "type": "num", "q": "Conversions rose from 80 to 104. What is the percentage increase?", "a": 30, "why": "24 / 80 = 30%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A42": {"id": "A42", "sec": "Calculation Capability", "type": "num", "q": "Your target CPA is 900 and your CVR is 3%. What is the maximum CPC you can afford?", "a": 27, "why": "Max CPC = target CPA x CVR = 900 x 0.03 = 27.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M39": {"id": "M39", "sec": "Calculation Capability", "type": "num", "q": "Total revenue 12,000,000. Total ad spend 3,000,000. What is the MER?", "a": 4, "why": "12,000,000 / 3,000,000 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M40": {"id": "M40", "sec": "Calculation Capability", "type": "num", "q": "A client needs 60 sales a month. Lead-to-sale is 15%. How many leads per month?", "a": 400, "why": "60 / 0.15 = 400.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M41": {"id": "M41", "sec": "Calculation Capability", "type": "num", "q": "Budget 900,000 and you need 400 leads. What CPL do you need?", "a": 2250, "why": "900,000 / 400 = 2,250.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N13": {"id": "N13", "sec": "Calculation Capability", "type": "num", "q": "Ad spend is 60,000 and ad-attributed revenue is 3,00,000. What is the ACOS, as a percentage?", "a": 20, "why": "ACOS = spend / ad revenue = 60,000 / 300,000 = 20%. It is the inverse of ROAS.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N14": {"id": "N14", "sec": "Calculation Capability", "type": "num", "q": "Ad spend 60,000. Ad revenue 2,00,000. Organic revenue 3,00,000. What is the TACOS, as a percentage?", "a": 12, "why": "TACOS = ad spend / TOTAL revenue = 60,000 / 500,000 = 12%. It shows the true dependence on paid.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N15": {"id": "N15", "sec": "Calculation Capability", "type": "num", "q": "Product price 1,200. Target ACOS 25%. CVR 4%. What is the maximum CPC you can afford?", "a": 12, "why": "Allowable cost per sale = 1,200 x 25% = 300. Max CPC = 300 x 4% = 12.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N16": {"id": "N16", "sec": "Calculation Capability", "type": "num", "q": "Impressions 80,000. CTR 1.5%. CVR 4%. CPC 30. What is the CPA?", "a": 750, "why": "1,200 clicks, 48 conversions, spend 36,000. CPA = 36,000 / 48 = 750. Or simply CPC / CVR.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N17": {"id": "N17", "sec": "Calculation Capability", "type": "num", "q": "CVR falls from 3% to 2% while CPC stays at 20. What is the new CPA?", "a": 1000, "why": "CPA = 20 / 0.02 = 1,000, up from 667. A one-point CVR drop raised CPA by half.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A02": {"id": "A02", "sec": "Strategic Mindset", "type": "mcq", "q": "Which bid strategy would you avoid on an account generating 3 conversions per month?", "opts": ["Target Impression Share", "Maximise Clicks", "Manual CPC", "Target ROAS"], "a": 3, "why": "Value-based automated bidding needs conversion volume. With 3 conversions a month it has nothing to learn from.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A14": {"id": "A14", "sec": "Strategic Mindset", "type": "mcq", "q": "A lookalike audience is best built from:", "opts": ["People who engaged with any post", "The largest customer list you can find", "All website visitors from the last 180 days", "Your highest-value customers, even if that list is relatively small"], "a": 3, "why": "Seed quality beats seed size. A lookalike of all leads inherits the quality of all leads, including the bad ones.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A31": {"id": "A31", "sec": "Strategic Mindset", "type": "mcq", "q": "You want to stop showing ads to existing customers on a prospecting campaign. You would:", "opts": ["Lower the bid on that audience", "Exclude a customer list or purchaser audience at the campaign or ad set level", "Add negative keywords", "Reduce the daily budget"], "a": 1, "why": "Exclusion, not bid adjustment. Prospecting budget spent on existing customers is not prospecting.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A33": {"id": "A33", "sec": "Strategic Mindset", "type": "mcq", "q": "Which is the best reason to split a campaign in two?", "opts": ["The campaign has too many keywords", "To make reporting look neater", "The keywords are different", "The two groups have different economics or different CPA targets"], "a": 3, "why": "Segment on economics, not on tidiness. Splitting dilutes conversion data the algorithm needs.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A44": {"id": "A44", "sec": "Strategic Mindset", "type": "mcq", "q": "Which number would you put FIRST in a client report for a lead gen account?", "opts": ["Impressions", "Click-through rate", "Cost per qualified lead against target", "Average position"], "a": 2, "why": "Lead with the business outcome. Platform metrics are supporting detail, not the headline.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A48": {"id": "A48", "sec": "Strategic Mindset", "type": "mcq", "q": "You inherit an account with no documentation. Your first week should mostly be spent:", "opts": ["Launching new tests to gather data", "Rebuilding the campaign structure", "Auditing structure, tracking, change history and what the client thinks success looks like", "Pausing the worst performers"], "a": 2, "why": "Audit before action. Rebuilding an account you do not yet understand is how good performance gets broken.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A49": {"id": "A49", "sec": "Strategic Mindset", "type": "mcq", "q": "The client asks for a change you think will hurt performance. You:", "opts": ["Do it on one campaign only, without telling them", "Do it - they are the client", "Refuse and explain why", "Explain the risk with evidence, propose a test, and do it properly if they still want it"], "a": 3, "why": "State the concern, propose a test, then execute properly if overruled. Quiet half-compliance is the worst option.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A54": {"id": "A54", "sec": "Strategic Mindset", "type": "mcq", "q": "You are asked to work on an account in a vertical you know nothing about. Day one, you:", "opts": ["Learn the customer, the buying cycle and the client's economics before touching settings", "Ask to be reassigned", "Copy a competitor's setup", "Apply the same structure you use on your other accounts"], "a": 0, "why": "Understand the business before the account. Template-applying is how accounts get structurally wrong from day one.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "M35": {"id": "M35", "sec": "Strategic Mindset", "type": "mcq", "q": "Which is the strongest reason to keep brand search in its own campaign?", "opts": ["Brand keywords have higher Quality Scores", "So brand performance does not flatter or distort non-brand reporting and budgeting", "Google requires it", "Brand campaigns need different ad copy"], "a": 1, "why": "Reporting integrity and budget control. Blending brand into generic is how accounts look better than they are.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "N18": {"id": "N18", "sec": "Strategic Mindset", "type": "mcq", "q": "A client's CPL target is 500 and you are at 650, with a 2% conversion rate. Which combination is most likely to close the gap?", "opts": ["Raise bids by 30% to win more auctions", "Pause the weakest ad groups, tighten targeting, and work on landing page conversion rate", "Increase the budget to gather more conversion data", "Switch to an impression share bidding strategy"], "a": 1, "why": "CPL = CPC / CVR. With CVR at 2%, the biggest available lever is conversion rate, not the auction.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "N19": {"id": "N19", "sec": "Strategic Mindset", "type": "mcq", "q": "Prospecting is at 2.2 ROAS on 1,00,000 spend; retargeting is at 6.0 on 30,000. Blended target is 3.0. What should you do?", "opts": ["Cut both budgets until efficiency improves", "Shift most of the budget into retargeting because its ROAS is higher", "Keep investing in prospecting — retargeting only converts demand that prospecting created, and it will not scale on its own", "Pause prospecting since it is below the 3.0 target"], "a": 2, "why": "Retargeting ROAS is borrowed from prospecting. Starving the top of the funnel collapses both within weeks.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "N20": {"id": "N20", "sec": "Strategic Mindset", "type": "mcq", "q": "You have to choose ONE thing to fix on an account with weak CTR, weak CVR and weak AOV. How do you decide?", "opts": ["Fix AOV because it affects revenue directly", "Fix whichever is furthest from the industry benchmark", "Fix them in the order they appear in the funnel", "Work out which one, if improved by a realistic amount, moves the business metric most"], "a": 3, "why": "Prioritise by expected impact, not by position in the funnel or by distance from a benchmark.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "N21": {"id": "N21", "sec": "Strategic Mindset", "type": "mcq", "q": "A client asks you to cut spend by 30% but keep lead volume flat. What is the honest answer?", "opts": ["Say it requires a roughly 43% improvement in efficiency, name where that could realistically come from, and be clear about what is achievable in the timeframe", "Refuse, because it is impossible", "Agree, then explain later if it does not work", "Agree and try your best"], "a": 0, "why": "Quantify what is being asked before answering it. Same volume on 70% of budget needs efficiency up by 1/0.7.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A08": {"id": "A08", "sec": "Problem Solving Approach", "type": "mcq", "q": "You need to make 300 changes across an account. The safest approach is:", "opts": ["Make them in the UI one at a time so you can check each one", "Export a backup, make the changes in Google Ads Editor, run the error check, post, then verify in change history", "Use a script so it happens instantly", "Ask the client to approve each change first"], "a": 1, "why": "The backup and the post-change verification are the parts people skip, and they are the parts that matter.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A21": {"id": "A21", "sec": "Problem Solving Approach", "type": "mcq", "q": "CPL has risen 60% over eight weeks. Which do you check FIRST?", "opts": ["The client's landing page design", "Competitor ad copy", "Change history and conversion tracking", "Whether to increase bids"], "a": 2, "why": "Check what changed and whether measurement is intact before forming any theory. Almost every wasted week starts by skipping this.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A22": {"id": "A22", "sec": "Problem Solving Approach", "type": "mcq", "q": "A search term has spent 40,000 across three months with zero conversions. You should:", "opts": ["Ignore it - three months is too short to judge", "Add it as a negative immediately", "Increase the bid to give it a fair chance", "Check whether the intent is genuinely irrelevant, then negative it if so"], "a": 3, "why": "Usually a negative, but not automatically: a high-intent term with a broken landing page needs a different fix.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A23": {"id": "A23", "sec": "Problem Solving Approach", "type": "mcq", "q": "A test is trending negative on day 4 of a planned 14-day run. You should:", "opts": ["Let it run unless it is causing real harm - day 4 is noise", "Double the budget to reach significance faster", "Change one variable and continue", "Stop it immediately to limit the damage"], "a": 0, "why": "Stopping early is how you learn nothing. Have a pre-agreed harm threshold, and hold the line otherwise.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A24": {"id": "A24", "sec": "Problem Solving Approach", "type": "mcq", "q": "The client wants a report at 5pm. At 4:45 you spot an error in the data. You:", "opts": ["Send it with the error, since the trend is still roughly right", "Tell them it will be 30 minutes late and why", "Remove the affected section without mentioning it", "Send it on time and correct it tomorrow"], "a": 1, "why": "Late and correct beats on-time and wrong. How someone handles this predicts how they handle a real mistake.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M24": {"id": "M24", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your associate made a bulk edit that broke pacing across four campaigns. Your first action is:", "opts": ["Escalate it to HR", "Contain the damage, then speak to them directly and privately", "Fix it yourself and say nothing to avoid discouraging them", "Raise it in the next team meeting as a learning example"], "a": 1, "why": "Contain first, then a direct private conversation. Silence teaches nothing; public correction teaches fear.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M26": {"id": "M26", "sec": "Problem Solving Approach", "type": "mcq", "q": "You are asked to present the numbers in a way that flatters performance. You:", "opts": ["Do it once and raise it internally afterwards", "Present both versions and let the client choose", "Do it - the client relationship comes first", "Decline, and offer a fair comparison period and honest framing instead"], "a": 3, "why": "Credibility is the asset. Flattered numbers create a bigger problem the following month.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A43": {"id": "A43", "sec": "Problem Solving Approach", "type": "mcq", "q": "A campaign's CTR doubled but conversions did not move. The most likely explanation is:", "opts": ["The tracking broke at the same time", "The new ad attracts more clicks but not more qualified intent", "Google is throttling the campaign", "The budget is too low"], "a": 1, "why": "Clickbait improves CTR and destroys CVR. Worth checking tracking, but the copy is the usual culprit.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A45": {"id": "A45", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your Meta ad set spent 40,000 and reports 20 purchases. Shopify shows 13 from Meta. You should:", "opts": ["Report the average of the two", "Stop using Shopify's reporting", "Report the 20 - it is the platform's own data", "Report the 13 and explain the attribution difference"], "a": 3, "why": "Backend is the source of truth; the platform number is directional. Explaining the gap is part of the job.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A46": {"id": "A46", "sec": "Problem Solving Approach", "type": "mcq", "q": "A 'conversion' in your Google Ads account is counting both form fills AND phone clicks. This means:", "opts": ["Your CPA is a blend of two different actions and may hide a problem in one of them", "The account is set up incorrectly and must be rebuilt", "Google will automatically separate them", "Nothing - both are leads"], "a": 0, "why": "Blended conversion actions are one of the commonest reasons a CPA looks fine while one channel quietly fails.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A47": {"id": "A47", "sec": "Problem Solving Approach", "type": "mcq", "q": "A campaign's spend dropped to near zero overnight with no changes made. First check:", "opts": ["Competitor activity", "Billing status, ad disapprovals and whether the campaign or ad group is still enabled", "The bid strategy target", "The landing page speed"], "a": 1, "why": "Billing failures and disapprovals cause more sudden stops than any auction dynamic.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A50": {"id": "A50", "sec": "Problem Solving Approach", "type": "mcq", "q": "You realise you have been reporting a metric incorrectly for two months. You:", "opts": ["Tell your manager immediately with the corrected numbers and the impact", "Wait until the quarterly review to raise it", "Ask a colleague whether anyone is likely to notice", "Correct it going forward and say nothing about the past"], "a": 0, "why": "Immediate disclosure with the corrected numbers. The delay is what damages trust, not the error.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A51": {"id": "A51", "sec": "Problem Solving Approach", "type": "mcq", "q": "Peak sale weekend and the client's site goes down for three hours. You:", "opts": ["Leave campaigns running - the traffic will return", "Pause or heavily throttle spend, alert the client, then restart gradually", "Pause everything permanently and wait for instructions", "Increase bids afterwards to make up lost ground"], "a": 1, "why": "Contain, communicate, restart gradually. Then quantify the loss and set up an uptime alert.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A52": {"id": "A52", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your manager asks you to do something you are fairly sure is wrong. You:", "opts": ["Escalate to their manager", "Do it as instructed", "Ask a question to understand the reasoning, state your concern once with evidence, then commit either way", "Do it slowly and hope it gets cancelled"], "a": 2, "why": "Understand first, disagree once and clearly, then commit. Passive resistance is the worst of both.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A53": {"id": "A53", "sec": "Problem Solving Approach", "type": "mcq", "q": "A test you designed is showing a clear winner after 3 days. You:", "opts": ["Stop the test and start a new one", "Extend the test indefinitely", "Roll out the winner immediately", "Check whether the sample and the conversion lag justify a conclusion before acting"], "a": 3, "why": "Three days is rarely enough. Check conversions, not clicks, and account for lag before calling it.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M34": {"id": "M34", "sec": "Problem Solving Approach", "type": "mcq", "q": "You want to test whether Audience Network placements are genuinely low quality. You should:", "opts": ["Look at the placement breakdown for delivery, CPA and downstream quality before excluding anything", "Ask Meta support", "Exclude it permanently - it is well known to be poor", "Exclude it and compare overall CPA before and after"], "a": 0, "why": "Check the breakdown first. Reflexive exclusion on reputation costs cheap inventory for no evidenced reason.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M46": {"id": "M46", "sec": "Problem Solving Approach", "type": "mcq", "q": "You have 40 conversions on variant A and 33 on variant B after two weeks. You should:", "opts": ["Recognise this is within noise and either run longer or accept no difference was found", "Roll out B because it had a better CTR", "Split budget 70/30 towards A", "Roll out A"], "a": 0, "why": "At these volumes the difference is not distinguishable from chance. Declaring a winner here is how false learnings spread.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M52": {"id": "M52", "sec": "Problem Solving Approach", "type": "mcq", "q": "The client's developer changed the site last night. The safest immediate action is:", "opts": ["Increase bids to offset any drop", "Pause all campaigns until it is verified", "Verify tracking is still firing and check the key user journeys, then decide", "Do nothing - site changes rarely affect ads"], "a": 2, "why": "Verify, then decide. Pausing everything is over-reaction; ignoring it is how a week of spend is wasted.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M54": {"id": "M54", "sec": "Problem Solving Approach", "type": "mcq", "q": "Two clients escalate on the same morning and you have a pitch at 3pm. You:", "opts": ["Triage by impact and reversibility, send holding responses with a specific time, protect the pitch prep", "Work through them in the order they arrived", "Delegate both to your associate", "Handle whoever is angriest first"], "a": 0, "why": "Triage by consequence, not volume. A holding response with a time commitment costs 30 seconds and buys hours.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M55": {"id": "M55", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your associate keeps missing QA checks. The most useful first step is:", "opts": ["Formal warning", "Work out whether it is capability, capacity or carelessness - the fix differs for each", "Do the QA yourself from now on", "Reduce their workload"], "a": 1, "why": "Diagnose before intervening. Doing it yourself removes the symptom and guarantees the recurrence.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M57": {"id": "M57", "sec": "Problem Solving Approach", "type": "mcq", "q": "You are two weeks from leave and have four accounts. A clean handover means:", "opts": ["Setting an out-of-office with an escalation address", "Pausing all tests until you return", "Telling the team you will check email", "A written account state, live tests with end dates, a named owner per account and a live briefing"], "a": 3, "why": "A named owner per account, not a group inbox. And a live briefing - documents alone do not transfer context.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M58": {"id": "M58", "sec": "Problem Solving Approach", "type": "mcq", "q": "The client asks you to compare this month against a month you know was unusually weak. You:", "opts": ["Provide it, and also show a fair comparison so the picture is not misleading", "Refuse to provide the comparison", "Provide it without comment", "Use it - they asked for it"], "a": 0, "why": "Answer the question AND give the honest context. Silently allowing a flattering comparison is a slow-burning problem.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}}, "written": {"AW1": {"id": "AW1", "type": "text", "q": "Describe a specific change you personally made in a Google Ads or Meta account that improved performance. State what the account was, what the numbers were before and after, over what period, and exactly what you changed.", "words": 200, "guide": "Look for settings-level specificity and a stated baseline and timeframe. Someone who did the work names the mechanism; someone who watched it happen stays general. Score 0-1 if no numbers or no timeframe.", "track": "both"}, "AW2": {"id": "AW2", "type": "text", "q": "Tell us about a mistake you made that cost a client money or time. What did you do in the first hour?", "words": 150, "guide": "Speed of disclosure is the signal, not the size of the mistake. Score 3 for immediate disclosure plus a control put in place. Score 0 for 'I have not made one' or for a mistake that turns out to be someone else's fault.", "track": "both"}, "AW3": {"id": "AW3", "type": "text", "q": "A client says 60% of the leads you are generating are junk. List the first five things you would
