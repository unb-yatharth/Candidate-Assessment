"Assume it is a sales-side problem", "Increase lead volume to compensate"], "a": 0, "why": "Look at the leads themselves. The mix has almost certainly shifted even if the account settings have not.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "M52": {"id": "M52", "sec": "Problem Solving Approach", "type": "mcq", "q": "The client's developer changed the site last night. The safest immediate action is:", "opts": ["Increase bids to offset any drop", "Pause all campaigns until it is verified", "Verify tracking is still firing and check the key user journeys, then decide", "Do nothing - site changes rarely affect ads"], "a": 2, "why": "Verify, then decide. Pausing everything is over-reaction; ignoring it is how a week of spend is wasted.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M54": {"id": "M54", "sec": "Problem Solving Approach", "type": "mcq", "q": "Two clients escalate on the same morning and you have a pitch at 3pm. You:", "opts": ["Triage by impact and reversibility, send holding responses with a specific time, protect the pitch prep", "Work through them in the order they arrived", "Delegate both to your associate", "Handle whoever is angriest first"], "a": 0, "why": "Triage by consequence, not volume. A holding response with a time commitment costs 30 seconds and buys hours.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M55": {"id": "M55", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your associate keeps missing QA checks. The most useful first step is:", "opts": ["Formal warning", "Work out whether it is capability, capacity or carelessness - the fix differs for each", "Do the QA yourself from now on", "Reduce their workload"], "a": 1, "why": "Diagnose before intervening. Doing it yourself removes the symptom and guarantees the recurrence.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M57": {"id": "M57", "sec": "Problem Solving Approach", "type": "mcq", "q": "You are two weeks from leave and have four accounts. A clean handover means:", "opts": ["Setting an out-of-office with an escalation address", "Pausing all tests until you return", "Telling the team you will check email", "A written account state, live tests with end dates, a named owner per account and a live briefing"], "a": 3, "why": "A named owner per account, not a group inbox. And a live briefing - documents alone do not transfer context.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M58": {"id": "M58", "sec": "Problem Solving Approach", "type": "mcq", "q": "The client asks you to compare this month against a month you know was unusually weak. You:", "opts": ["Provide it, and also show a fair comparison so the picture is not misleading", "Refuse to provide the comparison", "Provide it without comment", "Use it - they asked for it"], "a": 0, "why": "Answer the question AND give the honest context. Silently allowing a flattering comparison is a slow-burning problem.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "S33": {"id": "S33", "sec": "Problem Solving Approach", "type": "mcq", "q": "A client's revenue is up 15% and ad spend is up 15%. Their finance director says profit fell. The most likely reason is:", "opts": ["Revenue growth always lags spend", "The platforms are misreporting", "Discounting, returns or product mix eroded contribution margin", "The ad spend was recorded twice"], "a": 2, "why": "Revenue growth at constant ROAS can still destroy profit if margin moved. Senior people ask about margin unprompted.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S39": {"id": "S39", "sec": "Problem Solving Approach", "type": "mcq", "q": "Two accounts have identical ROAS. Account A is 60% retargeting, Account B is 15%. You conclude:", "opts": ["Account B is very likely producing more incremental revenue", "Account A is better optimised", "You need creative data before saying anything", "They are performing equally well"], "a": 0, "why": "Identical reported ROAS with very different incrementality. This is why channel mix belongs in every review.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S41": {"id": "S41", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your strongest manager tells you they have been approached by a competitor. You:", "opts": ["Tell them to let you know what they decide", "Immediately counter-offer", "Find out what is actually driving it before discussing money", "Escalate to HR and start recruiting a replacement"], "a": 2, "why": "Money is rarely the real reason and a counter-offer that fixes nothing buys about four months.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S42": {"id": "S42", "sec": "Problem Solving Approach", "type": "mcq", "q": "A client demands you remove a team member from their account for reasons you think are unfair. You:", "opts": ["Refuse and defend the team member", "Move the person and tell them it was their performance", "Comply immediately", "Understand the specific incidents, protect the team member's account of it, then decide - and tell them honestly either way"], "a": 3, "why": "Get the facts, and never let someone believe a client complaint was a performance judgment when it was not.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S46": {"id": "S46", "sec": "Problem Solving Approach", "type": "mcq", "q": "You discover a team member has been reporting a metric misleadingly for a quarter. You:", "opts": ["Report it to the client as the team member's error", "Address it internally without telling the client", "Correct it quietly going forward", "Establish whether it was error or intent, correct it with the client yourself, and address the behaviour"], "a": 3, "why": "Correct it with the client yourself - the accountability is yours. Error and intent need very different responses.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S47": {"id": "S47", "sec": "Problem Solving Approach", "type": "mcq", "q": "Two of your managers are in open conflict about account ownership. You:", "opts": ["Get both accounts of it separately, decide, explain the reasoning to both, and make the decision stick", "Let them work it out between themselves", "Reassign both to yourself", "Split the accounts down the middle"], "a": 0, "why": "Decide and explain. Unresolved ownership conflicts spread faster than almost anything else on a team.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S49": {"id": "S49", "sec": "Problem Solving Approach", "type": "mcq", "q": "You have to let someone go for performance. Before that conversation you should have:", "opts": ["Told the rest of the team", "Reduced their account load quietly", "Documented performance issues, given clear expectations and a real chance to improve", "Found their replacement"], "a": 2, "why": "If the conversation is a surprise, the failure was managerial. Clarity earlier is the kind version.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S52": {"id": "S52", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your team keeps escalating decisions to you that they could make themselves. This means:", "opts": ["They lack confidence and need more experience", "The decision rights and the tolerance for mistakes have not been made explicit", "You hired the wrong people", "The accounts are too complex"], "a": 1, "why": "People escalate when the cost of being wrong is unclear. Name the decision rights and the acceptable error.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S53": {"id": "S53", "sec": "Problem Solving Approach", "type": "mcq", "q": "You are asked to present quarterly results that are materially worse than forecast. You:", "opts": ["Attribute it to market conditions", "Lead with the wins and cover the shortfall briefly", "Lead with the shortfall, explain the cause honestly including your own part, and bring a revised plan", "Delay the review until performance recovers"], "a": 2, "why": "Lead with the bad news. Burying it is what turns a bad quarter into a lost account.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S54": {"id": "S54", "sec": "Problem Solving Approach", "type": "mcq", "q": "An intern on your team makes a costly mistake in their first month. The most important thing you do is:", "opts": ["Reduce their access permanently", "Escalate it so it is on record", "Make sure they understand the seriousness", "Fix it, then examine what in your process allowed a first-month intern to make it"], "a": 3, "why": "A junior person who could cause that damage unsupervised is a process failure, not a personnel one.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}}, "written": {"MW1": {"id": "MW1", "type": "text", "q": "A client's blended MER has fallen from 3.2 to 2.4 over a quarter while platform-reported ROAS held steady at around 4.0. Revenue is up 8%; spend is up 44%. Explain to the founder, in plain language, what is most likely happening and what you would do about it.", "words": 250, "guide": "Should reach marginal versus average return: the extra 44% of spend bought far less than the first rupee did. Bonus for spotting attribution inflation and retargeting harvesting existing demand. Must be readable by a non-marketer. Score 0-1 if they conclude performance is fine because ROAS held.", "track": "both"}, "MW2": {"id": "MW2", "type": "text", "q": "Describe an account you own or have owned. What was the client's target, what did you change last quarter, and what is the one thing you have not been able to fix?", "words": 250, "guide": "The unfixed thing is the real question - it tests honesty and self-awareness. Look for a specific target with a reason behind it, and a change described at settings level. Score 0-1 if everything they touched worked.", "track": "both"}, "MW3": {"id": "MW3", "type": "text", "q": "Describe the last time you were accountable for missing a target. What did you tell the client, and when?", "words": 200, "guide": "Timing is the signal: did the client hear it from them early, or find out themselves? Look for a revised forecast and a specific ask, not reassurance. Deflection onto the market, the season or the client is a 0.", "track": "both"}, "MW4": {"id": "MW4", "type": "text", "q": "A client's lead volume is at target and CPL is at target, but their sales team says close rates have halved since last quarter. Walk us through how you would investigate, and what you would do.", "words": 250, "guide": "Should get to traffic mix, not bid levels: what changed in source, match type, campaign type (PMax launch?), geography, or the offer. Bonus for checking client-side changes - sales headcount, follow-up speed, pricing. Score 0-1 for treating it purely as the sales team's problem.", "track": "both"}, "MW5": {"id": "MW5", "type": "text", "q": "Describe how you would take over a client account that is unhappy with the previous agency. What do you do in the first 30 days, and what do you deliberately avoid?", "words": 250, "guide": "Look for: audit before action, early expectation reset, a quick visible win balanced against not over-promising, and a refusal to trash the previous agency. The 'deliberately avoid' half is the more revealing one.", "track": "both"}, "MW6": {"id": "MW6", "type": "text", "q": "What is something widely believed in performance marketing that you think is wrong? Make the case, and then give the strongest argument against your own position.", "words": 200, "guide": "Tests independent thinking AND intellectual honesty. The counter-argument half is what separates a considered position from a contrarian pose. Score 0-1 for no position, or a position with no counter-argument.", "track": "both"}}}, "senior": {"label": "Sr. Manager", "difficulty": "Advanced", "minutes": 50, "slots": {"Theoretical Knowledge": 3, "Calculation Capability": 3, "Strategic Mindset": 7, "Problem Solving Approach": 5}, "wslots": 3, "q": {"M01": {"id": "M01", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Offline conversion import requires you to capture and store:", "opts": ["The IP address of the visitor", "The user's email address only", "The GCLID against the lead record in the CRM", "The campaign name in a hidden form field"], "a": 2, "why": "GCLID (or WBRAID/GBRAID) captured on the form and stored against the lead. Without it there is nothing to upload against.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M02": {"id": "M02", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Enhanced Conversions for Leads is most useful when:", "opts": ["You are running Display campaigns", "The client refuses to install any tracking", "You want to increase your conversion volume artificially", "You cannot reliably capture the GCLID and need to match on hashed email or phone instead"], "a": 3, "why": "It is the fallback when GCLID capture is not feasible, not a replacement for a proper OCI setup.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M03": {"id": "M03", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Under data-driven attribution, a conversion is reported on:", "opts": ["The date of the click that led to it", "The date the campaign started", "The date of the last impression", "The date the conversion happened"], "a": 0, "why": "Click date, which is why recent days back-fill and should never be judged as final.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M05": {"id": "M05", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Brand exclusions in Performance Max are used to:", "opts": ["Exclude branded products from the feed", "Stop competitors bidding on your brand", "Prevent PMax absorbing brand traffic that should sit in a controlled search campaign", "Remove your brand from Display placements"], "a": 2, "why": "Without them, PMax claims cheap brand conversions and the headline ROAS flatters the campaign.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M07": {"id": "M07", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A Merchant Center 'misrepresentation' disapproval usually relates to:", "opts": ["A mismatch between the site and the feed, or missing trust and policy information on the site", "The product price being too high", "Too many products in the feed", "Image resolution being too low"], "a": 0, "why": "Usually returns/contact/policy pages, unclear pricing or feed-to-site mismatch - not a feed formatting issue.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M10": {"id": "M10", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Advantage+ Shopping's headline ROAS tends to overstate incremental performance because:", "opts": ["It counts impressions as conversions", "It excludes new customers by default", "Meta uses a different currency conversion", "It absorbs retargeting and existing demand within a single reported number"], "a": 3, "why": "Which is why the existing-customer budget cap and new-customer share are the metrics that matter.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M13": {"id": "M13", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Under Consent Mode v2, some conversions are modelled. This means:", "opts": ["They only appear in GA4", "They are conversions from users who blocked ads", "They are estimates that cannot be matched to individual users", "They are duplicates and should be removed"], "a": 2, "why": "So platform and CRM will never reconcile exactly. Set that expectation before it becomes an argument.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M22": {"id": "M22", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The strongest available evidence that your ads caused sales is:", "opts": ["A rising conversion rate", "Positive client feedback", "A high platform-reported ROAS", "A geo holdout or conversion lift test"], "a": 3, "why": "Everything in a dashboard is correlation. Only a holdout gives you causation.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S14": {"id": "S14", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Incrementality testing matters most on:", "opts": ["New prospecting campaigns", "Brand and retargeting campaigns", "Display campaigns", "Any campaign under 10% of budget"], "a": 1, "why": "Brand and retargeting take the most credit for demand that already existed. That is where the overstatement lives.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S16": {"id": "S16", "sec": "Theoretical Knowledge", "type": "mcq", "q": "You should agree the source of truth for reporting with a client:", "opts": ["Only if a discrepancy arises", "At the quarterly review", "After the first month, once you understand the data", "Before the first reporting cycle"], "a": 3, "why": "Agreeing it after a discrepancy appears looks like moving the goalposts, however correct you are.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S17": {"id": "S17", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The main reason to run a brand holdout test is:", "opts": ["To measure how much brand-search conversion volume is genuinely incremental to organic", "To improve Quality Score on brand keywords", "To stop competitors bidding on your brand", "To reduce spend on brand terms"], "a": 0, "why": "It answers the one brand question clients actually ask, with evidence instead of assertion.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S18": {"id": "S18", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A process you build is genuinely valuable when:", "opts": ["It is documented in detail", "It is still used after you stop enforcing it", "It saves at least an hour per week", "Every team member has been trained on it"], "a": 1, "why": "Survival without enforcement is the only real test. Everything else is a document nobody opens.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M29": {"id": "M29", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Campaign priority settings in Shopping are used to:", "opts": ["Set the order products appear in", "Prioritise high-margin products automatically", "Decide which campaign gets budget first", "Control which campaign serves when the same product is eligible in more than one"], "a": 3, "why": "Combined with shared negatives, priority is how you tier traffic by query intent.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M30": {"id": "M30", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A supplemental feed lets you:", "opts": ["Override or add attributes without editing the primary feed source", "Feed data to Meta as well as Google", "Bypass Merchant Center review", "Add a second set of products"], "a": 0, "why": "Which is what makes title testing possible without asking the client's dev team for every change.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M31": {"id": "M31", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In PMax, 'audience signals' are:", "opts": ["Hard targeting - the campaign only reaches those people", "A starting hint to speed up learning; the campaign can still go beyond them", "Only used for the Display network portion", "Automatically generated and cannot be edited"], "a": 1, "why": "A signal, not a constraint. Treating them as targeting is a very common misunderstanding.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M32": {"id": "M32", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Value rules in Google Ads let you:", "opts": ["Exclude low-value products from Shopping", "Set different bids by device", "Adjust conversion value by location, device or audience so bidding reflects real worth", "Set a minimum order value"], "a": 2, "why": "The practical route to margin-aware or new-customer-aware bidding without rebuilding the feed.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M33": {"id": "M33", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Meta's existing-customer budget cap in Advantage+ Shopping exists to:", "opts": ["Cap the frequency of ads to customers", "Prevent the campaign exiting the learning phase", "Reduce total spend", "Limit how much of the budget goes to people who have already bought"], "a": 3, "why": "It is the main lever for pushing ASC towards new-customer acquisition rather than harvesting.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S34": {"id": "S34", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The main limitation of marketing mix modelling for a mid-sized account is:", "opts": ["It cannot include digital channels", "It requires user-level data", "It only works for TV advertising", "It needs a long history and substantial spend variation to produce reliable coefficients"], "a": 3, "why": "Below a certain spend and history, MMM produces confident-looking output with very wide real error bars.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S35": {"id": "S35", "sec": "Theoretical Knowledge", "type": "mcq", "q": "You want to prove brand search is incremental. The cleanest test is:", "opts": ["A geo-split holdout where brand campaigns are paused in matched regions", "Pause brand for a week and compare to the week before", "Compare branded organic traffic to branded paid traffic", "Compare brand ROAS to non-brand ROAS"], "a": 0, "why": "A matched geo holdout controls for time-based confounders. A before/after week does not.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S36": {"id": "S36", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In a geo holdout test, the most common design mistake is:", "opts": ["Running it for too long", "Test and control regions that are not comparable in baseline, seasonality or channel mix", "Including too many regions", "Measuring backend revenue rather than platform conversions"], "a": 1, "why": "Matching is everything. Badly matched geos produce a confident number that means nothing.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S48": {"id": "S48", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The best way to know whether your process changes actually worked is:", "opts": ["Ask the team if they like them", "Check whether they are still being followed six months later without enforcement", "Count how many people were trained", "Measure time saved in the first month"], "a": 1, "why": "Survival without enforcement. Everything else measures compliance, not adoption.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S51": {"id": "S51", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The most reliable early warning that an account is about to churn is:", "opts": ["A change in engagement - slower replies, cancelled meetings, a new stakeholder appearing", "A request for a fee reduction", "A competitor pitch", "A drop in ROAS"], "a": 0, "why": "By the time they mention fees or competitors the decision is usually made. Engagement moves first.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M15": {"id": "M15", "sec": "Calculation Capability", "type": "num", "q": "AOV is 2,500. COGS is 1,000. Shipping and payment fees are 300. What is the contribution margin, as a percentage?", "a": 48, "why": "(2,500 - 1,300) / 2,500 = 48%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M16": {"id": "M16", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 40%. What is the break-even ROAS?", "a": 2.5, "why": "Break-even ROAS = 1 / contribution margin = 1 / 0.40 = 2.5.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S01": {"id": "S01", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 35%. What is the break-even ROAS? (two decimal places)", "a": 2.86, "why": "1 / 0.35 = 2.857, so 2.86.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S02": {"id": "S02", "sec": "Calculation Capability", "type": "num", "q": "Monthly fee revenue is 3,000,000. Your largest client is 40% of that. Servicing that client costs 60% of its fee. If it churns, how much monthly gross profit do you lose?", "a": 480000, "why": "Fee = 1,200,000. Cost = 720,000. Gross profit lost = 480,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S03": {"id": "S03", "sec": "Calculation Capability", "type": "num", "q": "Spend rises from 2,000,000 to 2,800,000. Revenue rises from 7,000,000 to 8,400,000. What is the marginal ROAS on the additional spend?", "a": 1.75, "why": "(8,400,000 - 7,000,000) / (2,800,000 - 2,000,000) = 1,400,000 / 800,000 = 1.75.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S05": {"id": "S05", "sec": "Calculation Capability", "type": "num", "q": "Target payback period is 3 months. A customer generates 800 of contribution per month. What is the maximum CAC you can justify?", "a": 2400, "why": "3 x 800 = 2,400.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M37": {"id": "M37", "sec": "Calculation Capability", "type": "num", "q": "AOV 3,200. COGS 1,400. Shipping and fees 400. What is the contribution margin, as a percentage?", "a": 43.75, "why": "(3,200 - 1,800) / 3,200 = 43.75%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M38": {"id": "M38", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 25%. What is the break-even ROAS?", "a": 4, "why": "1 / 0.25 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M42": {"id": "M42", "sec": "Calculation Capability", "type": "num", "q": "Spend rose from 500,000 to 700,000; conversions rose from 250 to 310. What is the marginal CPA on the extra spend?", "a": 3333.33, "why": "200,000 / 60 = 3,333. Against a blended CPA of 2,258, the incremental spend is far more expensive.", "tol": 0.01, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M43": {"id": "M43", "sec": "Calculation Capability", "type": "num", "q": "Revenue 5,000,000 at a 40% contribution margin. Ad spend 1,600,000. What is the contribution after ad spend?", "a": 400000, "why": "5,000,000 x 0.40 = 2,000,000, minus 1,600,000 = 400,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M44": {"id": "M44", "sec": "Calculation Capability", "type": "num", "q": "Customer LTV is 9,000 with a 45% margin. What is the maximum CAC to break even on lifetime value?", "a": 4050, "why": "9,000 x 0.45 = 4,050.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S25": {"id": "S25", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 55%. What is the break-even ROAS? (two decimal places)", "a": 1.82, "why": "1 / 0.55 = 1.818, so 1.82.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S26": {"id": "S26", "sec": "Calculation Capability", "type": "num", "q": "Spend goes from 4,000,000 to 5,000,000. Revenue goes from 14,000,000 to 16,500,000. What is the marginal ROAS?", "a": 2.5, "why": "2,500,000 / 1,000,000 = 2.5.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S27": {"id": "S27", "sec": "Calculation Capability", "type": "num", "q": "A client's blended CAC is 3,000 with a 12-month LTV of 11,000 at 40% margin. What is the LTV:CAC ratio on a margin basis?", "a": 1.47, "why": "11,000 x 0.40 = 4,400. 4,400 / 3,000 = 1.47 - considerably weaker than the 3.7 the revenue figure suggests.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S28": {"id": "S28", "sec": "Calculation Capability", "type": "num", "q": "Portfolio fee revenue is 4,000,000 a month at an average 45% servicing cost. What is monthly gross profit?", "a": 2200000, "why": "4,000,000 x 0.55 = 2,200,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S29": {"id": "S29", "sec": "Calculation Capability", "type": "num", "q": "You must cut servicing hours 20% across a team costing 1,500,000 a month. What is the monthly saving if cost scales with hours?", "a": 300000, "why": "1,500,000 x 0.20 = 300,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S30": {"id": "S30", "sec": "Calculation Capability", "type": "num", "q": "New customers are 30% of 2,000 monthly orders. Total ad spend is 1,800,000. What is the new-customer CAC?", "a": 3000, "why": "600 new customers. 1,800,000 / 600 = 3,000. The blended figure of 900 would badly mislead.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S31": {"id": "S31", "sec": "Calculation Capability", "type": "num", "q": "Target payback is 6 months and monthly contribution per customer is 500. What is the maximum CAC?", "a": 3000, "why": "6 x 500 = 3,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S32": {"id": "S32", "sec": "Calculation Capability", "type": "num", "q": "Account A: 3,000,000 spend at 3.0 ROAS. Account B: 1,000,000 spend at 6.0 ROAS. What is the combined ROAS?", "a": 3.75, "why": "(9,000,000 + 6,000,000) / 4,000,000 = 3.75. Note it is spend-weighted, not the 4.5 average of the two.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "N24": {"id": "N24", "sec": "Calculation Capability", "type": "num", "q": "AOV 4,000. Contribution margin 35%. Target is to make 500 profit per order after ad cost. What is the maximum CAC?", "a": 900, "why": "Contribution = 4,000 x 35% = 1,400. Less 500 target profit = 900 maximum CAC.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "N25": {"id": "N25", "sec": "Calculation Capability", "type": "num", "q": "Spend 3,00,000 at 4.0 ROAS. You add 1,00,000 more and total revenue becomes 14,00,000. What is the marginal ROAS on the additional spend?", "a": 2, "why": "Was 12,00,000. Now 14,00,000. (14,00,000 - 12,00,000) / 1,00,000 = 2.0 — half the average.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "N26": {"id": "N26", "sec": "Calculation Capability", "type": "num", "q": "A subscription product bills 800 a month at 70% margin, and the average customer stays 9 months. What is the maximum CAC to break even on lifetime value?", "a": 5040, "why": "800 x 0.70 x 9 = 5,040.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M04": {"id": "M04", "sec": "Strategic Mindset", "type": "mcq", "q": "The biggest risk of running Performance Max on a lead gen account is:", "opts": ["It always costs more per click", "Lead quality dilution, with limited query-level control", "It cannot run alongside Search campaigns", "It requires a product feed"], "a": 1, "why": "Only sensible with lead scoring and OCI feeding back, plus brand exclusions and campaign-level negatives.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M08": {"id": "M08", "sec": "Strategic Mindset", "type": "mcq", "q": "Before moving an account from tCPA to tROAS, the most important prerequisite is:", "opts": ["A larger daily budget", "Verified, correctly passed conversion values", "At least 12 months of account history", "Switching all campaigns to broad match"], "a": 1, "why": "tROAS optimises to the value you send it. Wrong values means confidently optimising to the wrong thing.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M09": {"id": "M09", "sec": "Strategic Mindset", "type": "mcq", "q": "An initial tROAS target should be set based on:", "opts": ["Double the current ROAS, to create headroom", "The client's desired ROAS", "The account's trailing achieved ROAS", "The industry benchmark"], "a": 2, "why": "Set from what the account actually achieves, then step 10-15% at a time allowing relearning between moves.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M20": {"id": "M20", "sec": "Strategic Mindset", "type": "mcq", "q": "Campaign A is at 3.0 ROAS, Campaign B is at 5.0 ROAS. Should you move the whole budget to B?", "opts": ["Yes - B is clearly more efficient", "No - average ROAS says nothing about what the next rupee into B would return", "Yes, but only 50% of it", "No - you should never move budget between campaigns"], "a": 1, "why": "B may be saturated or audience-limited. Check headroom, move incrementally, measure marginal return.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M25": {"id": "M25", "sec": "Strategic Mindset", "type": "mcq", "q": "A client demands a 50% CPL reduction in 30 days and you believe it is not achievable. You should:", "opts": ["Agree, and manage expectations later", "Refuse and explain that the request is unrealistic", "State the constraint with evidence, offer the achievable trade-off, and confirm it in writing", "Agree to try, without committing to the number"], "a": 2, "why": "Name the constraint, offer the real trade-off (lower CPL at lower volume), and document what was agreed.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S04": {"id": "S04", "sec": "Strategic Mindset", "type": "mcq", "q": "In the scenario above, average ROAS fell from 3.5 to 3.0 and break-even ROAS is 2.5. What does that tell you?", "opts": ["The spend increase was too small to judge", "Break-even ROAS is the wrong metric here", "Performance is still acceptable - the average is above break-even", "The incremental spend is losing money, even though the average still looks healthy"], "a": 3, "why": "Marginal ROAS of 1.75 against a 2.5 break-even means the additional 800,000 destroyed value. The average hides it. This is the single most expensive mistake in scaling accounts.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S06": {"id": "S06", "sec": "Strategic Mindset", "type": "mcq", "q": "First-order contribution is 900 and CAC is 1,500. The first order is:", "opts": ["Profitable", "Loss-making, and only justified if repeat purchase covers the gap within an agreed payback window", "Break-even", "Impossible to assess without knowing ROAS"], "a": 1, "why": "Buying first orders at a loss is a legitimate strategy - but only with cohort data and the client's finance side agreeing the window.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S07": {"id": "S07", "sec": "Strategic Mindset", "type": "mcq", "q": "The most reliable input when forecasting the effect of a budget increase is:", "opts": ["Industry benchmark growth rates", "Last month's average CPA", "The historical marginal CPA/ROAS curve plus remaining impression share", "The client's growth target"], "a": 2, "why": "Average performance tells you nothing about what the next unit of spend returns.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S08": {"id": "S08", "sec": "Strategic Mindset", "type": "mcq", "q": "A client already holds 85% impression share on non-brand search and asks to double spend. The most likely outcome is:", "opts": ["A large drop in CPC due to increased volume", "Improved Quality Score from higher spend", "A proportional increase in conversions", "Sharply diminishing returns on search - growth has to come from other channels, audiences or geographies"], "a": 3, "why": "There is almost no headroom left. Promising linear scaling here is how accounts and relationships break.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S09": {"id": "S09", "sec": "Strategic Mindset", "type": "mcq", "q": "A client representing 40% of portfolio revenue is significantly over-serviced. Your first move is:", "opts": ["Audit where the hours actually go, then redesign scope or renegotiate the fee", "Absorb the cost - the account is too important to risk", "Hire an additional associate to cover the workload", "Reduce the service level and inform the client"], "a": 0, "why": "Understand the hours before you change headcount, service level or price. Usually the hours are in reporting and ad-hoc requests.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S10": {"id": "S10", "sec": "Strategic Mindset", "type": "mcq", "q": "Two accounts are at renewal risk within 90 days. Your first action is:", "opts": ["Improve performance as quickly as possible", "Diagnose the actual cause of dissatisfaction, which is often communication rather than performance", "Offer a fee reduction to retain them", "Assign your strongest manager to both"], "a": 1, "why": "Churn is frequently about feeling unheard or uninformed. Fixing performance without fixing that loses the account anyway.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S13": {"id": "S13", "sec": "Strategic Mindset", "type": "mcq", "q": "Deciding the Google/Meta split for a new client should start from:", "opts": ["Category search volume and intent, versus the need to create demand", "Whichever platform the client already uses", "Whichever platform your team is stronger on", "An industry-standard split such as 60/40"], "a": 0, "why": "Google captures existing demand; Meta creates it. The split is a hypothesis with a stated reallocation rule, not a formula.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S15": {"id": "S15", "sec": "Strategic Mindset", "type": "mcq", "q": "The right governing metric for an ecommerce portfolio is:", "opts": ["Total conversions reported by each platform", "Summed platform ROAS across channels", "Backend MER and new-customer CAC", "Average CPC across accounts"], "a": 2, "why": "Summed platform ROAS double counts by design. MER and new-customer CAC are what the client's P&L actually feels.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S20": {"id": "S20", "sec": "Strategic Mindset", "type": "mcq", "q": "Scope creep is best managed by:", "opts": ["Absorbing it to protect the relationship", "Charging for every additional request", "Referring to the contract when it becomes significant", "Naming the pattern early and making the trade-off visible"], "a": 3, "why": "Say yes to small things, name the pattern early on large ones, and make the trade-off visible rather than silent.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S21": {"id": "S21", "sec": "Strategic Mindset", "type": "mcq", "q": "Reducing servicing hours by 20% should start with:", "opts": ["Auditing where the hours actually go - usually reporting and ad-hoc requests", "Reducing meeting frequency with clients", "Moving accounts to junior staff", "Cutting optimisation time"], "a": 0, "why": "Cutting optimisation time is cutting the product. The hours are almost always elsewhere.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S24": {"id": "S24", "sec": "Strategic Mindset", "type": "mcq", "q": "The first two weeks of taking over a new portfolio should be spent:", "opts": ["Meeting every client to reassure them", "Building a new reporting template", "Restructuring the weakest accounts", "Diagnosing - accounts, clients, team and commercials - before changing anything material"], "a": 3, "why": "Diagnose before you act. Being able to name what you will deliberately NOT do is the senior signal.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M27": {"id": "M27", "sec": "Strategic Mindset", "type": "mcq", "q": "You want Smart Bidding to optimise towards qualified leads rather than form fills. You need:", "opts": ["A higher tCPA target", "Qualified-lead outcomes fed back to Google with values, via offline conversion import", "To switch to Maximise Clicks", "To exclude unqualified search terms"], "a": 1, "why": "Smart Bidding optimises to what you send it. Negatives help, but only feedback changes what it chases.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M47": {"id": "M47", "sec": "Strategic Mindset", "type": "mcq", "q": "The most defensible way to set next quarter's target is:", "opts": ["Add 20% to last quarter", "Model from marginal returns and headroom, present a range, and state the assumptions", "Use the client's board target", "Match the category benchmark"], "a": 1, "why": "A range with assumptions is honest and defensible. A single number is a hostage.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M49": {"id": "M49", "sec": "Strategic Mindset", "type": "mcq", "q": "You are asked for one metric to judge an ecommerce account's health. You pick:", "opts": ["Total conversions", "Average CPC", "Platform ROAS", "MER, alongside new-customer share"], "a": 3, "why": "MER reflects the P&L. New-customer share tells you whether the growth engine is actually running.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M51": {"id": "M51", "sec": "Strategic Mindset", "type": "mcq", "q": "A PMax campaign launched three weeks ago and CPA looks excellent. Before celebrating, check:", "opts": ["Whether it has exited the learning period", "Whether it is cannibalising brand and existing search conversions", "Whether the asset group has enough creative", "Whether the budget is fully spending"], "a": 1, "why": "PMax's early wins are frequently conversions your search campaigns were already getting.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M53": {"id": "M53", "sec": "Strategic Mindset", "type": "mcq", "q": "You disagree with the client's in-house team on strategy, and they outrank you in the room. You:", "opts": ["Escalate to their manager", "Agree publicly and do it your way", "Defer entirely", "Understand their reasoning, state your position with evidence and a cost estimate, propose a test, document the outcome"], "a": 3, "why": "They may have context you lack - stock, margin, a board commitment. Propose a test rather than win an argument.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M56": {"id": "M56", "sec": "Strategic Mindset", "type": "mcq", "q": "A client is going quiet - slower replies, fewer meetings, no new briefs. You:", "opts": ["Offer a discount", "Wait for them to raise anything that is wrong", "Proactively ask for a conversation about how the relationship is going", "Send more detailed reports"], "a": 2, "why": "Silence is the most reliable churn signal there is. Waiting to be told is how accounts are lost without warning.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M59": {"id": "M59", "sec": "Strategic Mindset", "type": "mcq", "q": "Your account's performance is fine, but the client's business is struggling for reasons outside media. You:", "opts": ["Keep reporting on media metrics - that is your scope", "Raise it directly, connect your work to their actual problem, and adjust what you optimise for", "Reduce spend without telling them", "Wait for them to bring it up"], "a": 1, "why": "The account being fine is not the same as the client being fine. Managers who notice the difference keep clients.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S37": {"id": "S37", "sec": "Strategic Mindset", "type": "mcq", "q": "A forecast you present should always include:", "opts": ["Last year's actuals only", "A single committed number the client can plan against", "A range, the assumptions behind it, and what would invalidate it", "The best case, to secure budget approval"], "a": 2, "why": "Ranges with assumptions survive contact with reality. Point forecasts become the number you are judged against.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S38": {"id": "S38", "sec": "Strategic Mindset", "type": "mcq", "q": "Which portfolio-level metric best predicts revenue risk over the next two quarters?", "opts": ["Total spend under management", "Number of active campaigns", "Average ROAS across accounts", "Client concentration and account tenure alongside satisfaction signals"], "a": 3, "why": "Concentration is the risk that actually kills agencies. Performance metrics are lagging indicators of it.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S40": {"id": "S40", "sec": "Strategic Mindset", "type": "mcq", "q": "You inherit a portfolio and one account is losing money on servicing but is the founder's personal relationship. You:", "opts": ["Leave it alone", "Quantify the loss, present it with options, and let the commercial owner decide with real numbers", "Reduce the service level quietly", "Recommend resigning the account"], "a": 1, "why": "Your job is to make the trade-off visible with numbers, not to make the relationship decision unilaterally.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S43": {"id": "S43", "sec": "Strategic Mindset", "type": "mcq", "q": "Your team is at capacity and sales wants to sign two more accounts. You:", "opts": ["Model the capacity honestly, show what would have to give, and put the decision in front of the commercial owner", "Accept and work out the details later", "Accept but reduce service on existing accounts", "Say no until you can hire"], "a": 0, "why": "Make the trade-off explicit. Quietly absorbing it is how service quality decays without anyone deciding to let it.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S44": {"id": "S44", "sec": "Strategic Mindset", "type": "mcq", "q": "The single most useful thing to do in the first two weeks of owning a new portfolio is:", "opts": ["Rebuild the weakest account", "Talk to every client and every team member, and read the last two quarters of reporting", "Introduce a new reporting template", "Meet the biggest client"], "a": 1, "why": "Diagnosis, breadth first. Acting on the first account you look at is how you solve the wrong problem well.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S45": {"id": "S45", "sec": "Strategic Mindset", "type": "mcq", "q": "A pitch prospect asks for a guaranteed CPA before you have seen their data. You:", "opts": ["Guarantee it and manage expectations after winning", "Give a conservative number to stay in the running", "Explain what you would need to see, give a directional range with conditions, and be clear about what you will not guarantee", "Refuse to discuss numbers"], "a": 2, "why": "A guarantee made without data is a client conflict scheduled for month three.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S50": {"id": "S50", "sec": "Strategic Mindset", "type": "mcq", "q": "A client wants to move to a performance-based fee tied to ROAS. Your first concern is:", "opts": ["Whether the fee would be higher or lower", "Whether competitors offer the same", "Whether the team can hit the number", "Whether you control the variables it depends on - site, pricing, stock, product"], "a": 3, "why": "Being paid on an outcome you only partly control is how agencies lose money on their best work.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M21": {"id": "M21", "sec": "Problem Solving Approach", "type": "mcq", "q": "Google and Meta together report more revenue than the client's backend shows. This indicates:", "opts": ["Fraud in one of the accounts", "The backend is under-reporting", "Double counting and overlapping attribution between the platforms", "A currency error"], "a": 2, "why": "Both platforms claim the same conversion. It is why MER exists as a governing metric.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "M23": {"id": "M23", "sec": "Problem Solving Approach", "type": "mcq", "q": "CPL is up 45%, volume is flat, and lead-to-SQL has fallen from 32% to 19%. The most likely driver is:", "opts": ["A change in traffic quality or source mix", "Seasonality", "The landing page has slowed down", "Bids are set too low"], "a": 0, "why": "A simultaneous CPL rise and SQL-rate fall points at what kind of traffic you are buying, not at bid levels.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S11": {"id": "S11", "sec": "Problem Solving Approach", "type": "mcq", "q": "An associate is consistently underutilised. The right response is:", "opts": ["Move them to a different team", "Give them more shadowing time", "Redistribute work and give them owned scope with a review layer", "Wait until the portfolio grows"], "a": 2, "why": "Underutilisation is a delegation failure, not a capability failure. Owned scope with review is how people grow.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S12": {"id": "S12", "sec": "Problem Solving Approach", "type": "mcq", "q": "A manager is technically strong but defensive with clients. You should:", "opts": ["Accept it, because the technical work is what matters", "Pair them permanently with someone who handles the calls", "Remove them from all client contact", "Coach on the specific behaviour with observed calls, clear expectations and a timeline"], "a": 3, "why": "Coach the behaviour with evidence, not the personality. Be willing to move them if it does not change.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S19": {"id": "S19", "sec": "Problem Solving Approach", "type": "mcq", "q": "A hire that does not work out is most often explained by:", "opts": ["The candidate misrepresenting themselves", "Bad luck", "A signal the interviewer noticed but did not probe", "Poor onboarding"], "a": 2, "why": "Almost always there was a moment of doubt that nobody chased. That is what the must-pass gate is for.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S22": {"id": "S22", "sec": "Problem Solving Approach", "type": "mcq", "q": "In a pitch, when you do not know the answer to a technical question you should:", "opts": ["Give your best guess confidently", "Say you do not know, say how you would find out, and commit to a specific follow-up time", "Redirect to a topic you know well", "Defer to a colleague and move on"], "a": 1, "why": "A senior person who cannot say 'I do not know' is a liability in front of clients. Then actually follow up.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S23": {"id": "S23", "sec": "Problem Solving Approach", "type": "mcq", "q": "An underperforming team member who is well-liked should be:", "opts": ["Given a smaller portfolio indefinitely", "Given more time, since morale matters", "Given explicit expectations, a timeline and support - and managed out if it does not change", "Moved quietly to another team"], "a": 2, "why": "Tolerating it is a decision that costs the rest of the team. Clarity and a timeline is the kind version.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "M45": {"id": "M45", "sec": "Problem Solving Approach", "type": "mcq", "q": "Blended ROAS is flat but new-customer CAC has risen 40%. What is most likely happening?", "opts": ["The tracking is broken", "Competitors have entered the market", "Nothing - blended ROAS is the metric that matters", "Spend has shifted towards retargeting and existing customers, propping up the blended number"], "a": 3, "why": "The classic silent failure: the account looks stable while the acquisition engine stalls.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "M50": {"id": "M50", "sec": "Problem Solving Approach", "type": "mcq", "q": "Lead volume is stable but sales say close rates halved. Nothing changed in the account. First move:", "opts": ["Get the actual lead records and review them wit ach", "diff": "high"}, "S42": {"id": "S42", "sec": "Problem Solving Approach", "type": "mcq", "q": "A client demands you remove a team member from their account for reasons you think are unfair. You:", "opts": ["Refuse and defend the team member", "Move the person and tell them it was their performance", "Comply immediately", "Understand the specific incidents, protect the team member's account of it, then decide - and tell them honestly either way"], "a": 3, "why": "Get the facts, and never let someone believe a client complaint was a performance judgment when it was not.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S46": {"id": "S46", "sec": "Problem Solving Approach", "type": "mcq", "q": "You discover a team member has been reporting a metric misleadingly for a quarter. You:", "opts": ["Report it to the client as the team member's error", "Address it internally without telling the client", "Correct it quietly going forward", "Establish whether it was error or intent, correct it with the client yourself, and address the behaviour"], "a": 3, "why": "Correct it with the client yourself - the accountability is yours. Error and intent need very different responses.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S47": {"id": "S47", "sec": "Problem Solving Approach", "type": "mcq", "q": "Two of your managers are in open conflict about account ownership. You:", "opts": ["Get both accounts of it separately, decide, explain the reasoning to both, and make the decision stick", "Let them work it out between themselves", "Reassign both to yourself", "Split the accounts down the middle"], "a": 0, "why": "Decide and explain. Unresolved ownership conflicts spread faster than almost anything else on a team.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S49": {"id": "S49", "sec": "Problem Solving Approach", "type": "mcq", "q": "You have to let someone go for performance. Before that conversation you shou unsupervised is a process failure, not a personnel one.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}}, "written": {"SW1": {"id": "SW1", "type": "text", "q": "You have just taken over a portfolio of six accounts totalling 9,000,000 a month in spend, with a team of four (one manager, two associates, one intern). Two accounts are at renewal risk within 90 days, and the largest account is 40% of portfolio revenue and over-serviced. Outline your first 30 days - and explicitly state what you will NOT do.", "words": 300, "guide": "The 'will not do' is the whole question. Look for prioritisation by revenue at risk, diagnosis before action, and a refusal to promise everything. Score 0-1 for a generic 30/60/90 template that ignores the specifics given.", "track": "both"}, "SW2": {"id": "SW2", "type": "text", "q": "The largest client wants to double spend over two quarters. What would need to be true for that to work, and how would you forecast it?", "words": 300, "guide": "Should name conditions: impression share headroom, audience saturation, creative production capacity, landing page and offer capacity, fulfilment. Forecast built on marginal returns with a range and stated assumptions, plus a staged ramp with review gates. Score 0-1 for any answer implying linear scaling.", "track": "both"}, "SW3": {"id": "SW3", "type": "text", "q": "Describe a process you built that is still in use after you stopped enforcing it. What was it, and why did it survive?", "words": 200, "guide": "Tests whether they build capability or just output. The 'why it survived' answer usually reveals whether they understand adoption - it survived because it saved the user time, not because it was mandated.", "track": "both"}, "SW4": {"id": "SW4", "type": "text", "q": "You are asked to build the case for adding a fifth person to your team. Write the argument you would put to the person who controls the budget.", "words": 300, "guide": "Should be commercial, not operational: reven function grade(){
  const lv=KEY[R.level],rows=[],secs={};
  let correct=0,wrong=0,skipped=0;
  R.slots.forEach(s=>{
    const sec=s.sec;secs[sec]=secs[sec]||{n:0,c:0,s:0};secs[sec].n++;
    if(s.skipped||!s.chose){skipped++;secs[sec].s++;
      rows.push({sec:sec,skipped:true,pair:s.pair.map(id=>lv.q[id])});return;}
    const q=lv.q[s.chose],other=lv.q[s.pair.find(id=>id!==s.chose)];
    let ok=false,shown="—";
    if(q.type==="mcq"){
      if(s.ans!==null&&s.ans!==undefined){shown=q.opts[s.ans];ok=(s.ans===q.a);}
    }else{
      if(s.ans!==null&&s.ans!==undefined&&s.ans!==""){shown=String(s.ans);
        const tol=Math.max(Math.abs(q.a)*(q.tol||0.02),0.005);ok=Math.abs(s.ans-q.a)<=tol;}
    }
    if(ok){correct++;secs[sec].c++;}else{wrong++;}
    rows.push({sec:sec,q:q,other:other,ok:ok,shown:shown,
      correct:q.type==="mcq"?q.opts[q.a]:String(q.a)});
  });
  const n=R.slots.length;
  const autoPct=n?correct/n*100:0;
  const ws=R.wslots||[];
  let wpts=0,wdone=0;
  ws.forEach(s=>{const v=R.written_scores[s.chose];if(v!==undefined&&v!==null){wpts+=v;wdone++;}});
  const wmax=ws.length*3;
  const writPct=(ws.length&&wdone===ws.length)?wpts/wmax*100:null;
  const combined=writPct===null?null:autoPct*0.7+writPct*0.3;
  return {rows,secs,n,correct,wrong,skipped,autoPct,ws,wpts,wmax,writPct,combined};
}

function band(p){if(p>=80)return["b-go","PROCEED — send the practical case study"];
  if(p>=65)return["b-mid","BORDERLINE — proceed only if the written answers are strong"];
  return["b-no","DO NOT PROCEED — below the bar for this level"];}

  h+='<div class="card"><h2>Question by question</h2>'+
    '<p class="sub">Each row is one slot. The candidate chose one question from a pair — the one they turned down is '+
    'shown in grey, because what someone avoids is itself informative.</p><div class="rule"></div>'+
    '<table><tr><th style="width:30px"></th><th>Question they answered</th><th style="width:175px">Their answer</th>'+
    '<th style="width:175px">Correct</th></tr>';
  g.rows.forEach(r=>{
    if(r.skipped){
      h+='<tr class="skip"><td class="sk">–</td><td colspan="3"><b>Skipped</b> ('+esc(r.sec)+') — '+
        'declined both: <span class="alt">'+r.pair.map(q=>esc(q.q)).join(' &nbsp;/&nbsp; ')+'</span></td></tr>';
      return;}
    h+='<tr class="'+(r.ok?"":"wrong")+'"><td class="'+(r.ok?"tick":"cross")+'">'+(r.ok?"✓":"✗")+'</td>'+
      '<td><b>'+r.q.id+'</b> '+esc(r.q.q)+'<div class="why">'+esc(r.q.why)+'</div>'+
      (r.other?'<div class="alt">Chose this over: '+esc(r.other.q)+'</div>':'')+'</td>'+
      '<td>'+esc(r.shown)+'</td><td>'+esc(r.correct)+'</td></tr>';});
  h+='</table></div>';

  $("out").innerHTML=h;
  document.querySelectorAll(".scorebtns").forEach(gb=>{
    gb.querySelectorAll(".sb").forEach(b2=>{b2.onclick=()=>{
      R.written_scores[gb.dataset.w]=parseInt(b2.dataset.v,10);
      const y=window.scrollY;render();window.scrollTo(0,y);};});});
}

window.syncScoreToDb = async function() {
  if (!R || !R._db_id || !db) return;
  const g = grade();
  const btn = $("syncDbBtn");
  const status = $("syncStatus");
  if (btn) { btn.disabled = true; btn.textContent = "Syncing..."; }
  try {
    const { error } = await db.from('candidate_assessments').update({
      mcq_score: Math.round(g.autoPct),
      written_score: g.writPct !== null ? Math.round(g.writPct) : null,
      total_score: g.combined !== null ? Math.round(g.combined) : Math.round(g.autoPct),
      status: 'graded',
      graded_at: new Date().toISOString()
    }).eq('id', R._db_id);
    if (error) {
      if (status) status.innerHTML = '<div class="warn">Error syncing score to database: ' + esc(error.message) + '</div>';
      if (btn) { btn.disabled = false; btn.textContent = "Sync & Save Score to Database"; }
    } else {
      if (status) status.innerHTML = '<div class="ok"><b>Score Synced!</b> Candidate result updated in Supabase database. The candidate can now view their final result on the Result Portal.</div>';
      if (btn) { btn.textContent = "Score Synced to Database ✓"; }
    }
  } catch (err) {
    console.error(err);
    if (status) status.innerHTML = '<div class="warn">An unexpected error occurred during sync.</div>';
    if (btn) { btn.disabled = false; btn.textContent = "Sync & Save Score to Database"; }
  }
};
function row(a,b){return '<tr><td style="width:230px"><b>'+a+'</b></td><td>'+b+'</td></tr>';}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script></body></html>
