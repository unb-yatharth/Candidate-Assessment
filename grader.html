 check, in order, and explain why that order.", "words": 200, "guide": "Should define 'junk' with the client first, then work source-outward: search terms, form friction, geo, creative promise, then the client's own follow-up speed. Order and reasoning matter more than the list.", "track": "lg"}, "AW4": {"id": "AW4", "type": "text", "q": "A client's Shopping ROAS is 4.0, but the founder says the business is losing money on marketing. Give three possible explanations.", "words": 200, "guide": "Strong answers include: margin too thin for a 4.0 ROAS, platform ROAS double-counting or overlapping with Meta, heavy retargeting harvesting existing demand, returns and discounting not accounted for, brand traffic inflating the number.", "track": "ec"}, "AW5": {"id": "AW5", "type": "text", "q": "Walk us through how you would audit a Google Ads account you have just been given access to. What do you look at, in what order, and why that order?", "words": 200, "guide": "Look for tracking validity first, then structure, then performance - not the reverse. A candidate who starts with keyword bids has not learned that most account problems are measurement or structure problems.", "track": "both"}, "AW6": {"id": "AW6", "type": "text", "q": "Tell us about a time you disagreed with how something was being done and said so. What happened?", "words": 150, "guide": "Tests whether they will speak up at all, and how. Strong answers show they understood the other side first, raised it once with reasoning, and committed to the outcome. 'I just did what I was told' is a 0-1.", "track": "both"}, "AW7": {"id": "AW7", "type": "text", "q": "Pick one metric you check every single day on the accounts you run, and one you deliberately ignore day to day. Explain both choices.", "words": 150, "guide": "The 'deliberately ignore' half is the real question - it tests whether they understand noise, conversion lag and which numbers are diagnostics rather than decisions. Someone who checks everything daily is reacting, not managing.", "track": "both"}}}, "manager": {"label": "Manager", "difficulty": "Intermediate to advanced", "minutes": 45, "slots": {"Theoretical Knowledge": 5, "Calculation Capability": 4, "Strategic Mindset": 6, "Problem Solving Approach": 5}, "wslots": 3, "q": {"A01": {"id": "A01", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Shared negative keyword lists are best used for:", "opts": ["Competitor brand names only", "Every negative you ever find, to keep things in one place", "Account-wide irrelevant themes applied across many campaigns", "Negatives that only apply to a single ad group"], "a": 2, "why": "Shared lists for account-wide junk. Campaign level for intent tiering. Ad group level for cross-negation.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A03": {"id": "A03", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Ad Rank is determined by:", "opts": ["Bid, ad quality, Ad Rank thresholds, auction context and expected impact of assets", "Quality Score multiplied by daily budget", "Click-through rate and account spend history", "Your maximum bid alone"], "a": 0, "why": "Relevance lowers your actual CPC, not just your position. 'Highest bid wins' is the classic wrong answer.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A04": {"id": "A04", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Search Lost IS (budget) of 45% means:", "opts": ["45% of your clicks were wasted", "You lost 45% of available impressions because the campaign was limited by budget", "Your budget is 45% higher than it needs to be", "45% of competitors outranked you"], "a": 1, "why": "Distinguishing lost IS (budget) from lost IS (rank) tells you whether the constraint is money or quality.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A05": {"id": "A05", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A responsive search ad allows a maximum of:", "opts": ["20 headlines and 4 descriptions", "10 headlines and 2 descriptions", "15 headlines and 4 descriptions", "5 headlines and 5 descriptions"], "a": 2, "why": "15 and 4. Worth knowing because the practical skill is writing 15 genuinely distinct angles, not 15 rewordings.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A06": {"id": "A06", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Pinning a headline to position 1:", "opts": ["Has no effect on delivery", "Is required for all brand campaigns", "Guarantees a higher Quality Score", "Reduces the number of ad combinations Google can test"], "a": 3, "why": "Pinning trades testing surface for control. Use it for legal or brand requirements, not as a default habit.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A07": {"id": "A07", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A campaign with a 5,000 daily budget spent 6,200 yesterday. This is:", "opts": ["Normal - Google can overdeliver on a given day but caps at the monthly charging limit", "A sign the bid strategy is broken", "Only possible if someone changed the budget", "An error you should report to the client immediately"], "a": 0, "why": "Average daily budget x 30.4 is the monthly cap. Daily overspend is expected and self-corrects.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A09": {"id": "A09", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Meta's learning phase typically exits after approximately:", "opts": ["7 days regardless of volume", "100 clicks per ad set", "50 optimisation events per ad set per week", "1,000 impressions per ad"], "a": 2, "why": "~50 events per ad set per week. This is why splitting a small budget across many ad sets fails.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A10": {"id": "A10", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which of these resets the Meta learning phase?", "opts": ["Any change to the campaign name", "Viewing the ad set in Ads Manager", "Adding a new comment reply", "A significant edit to the ad set's budget, audience or optimisation event"], "a": 3, "why": "Meaningful edits reset learning. Daily tinkering is why some accounts never stabilise.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A11": {"id": "A11", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The Conversions API is used to:", "opts": ["Send events server-side alongside the pixel, deduplicated using a shared event ID", "Import Google Ads conversions into Meta", "Automatically create lookalike audiences", "Replace the pixel entirely"], "a": 0, "why": "Alongside, not instead of. The shared event_id is what prevents double counting.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A12": {"id": "A12", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Event Match Quality measures:", "opts": ["How relevant your creative is to the audience", "How well the customer information you send matches Meta users", "How many conversions an ad set produced", "The quality score of your landing page"], "a": 1, "why": "Low EMQ means Meta cannot attribute or optimise properly. Fixed by passing more hashed parameters.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A13": {"id": "A13", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Advantage+ placements are generally recommended because:", "opts": ["They guarantee a lower CPA", "They only show ads on Facebook and Instagram feeds", "They let Meta find cheaper inventory across all available placements", "They exclude Audience Network by default"], "a": 2, "why": "Restricting placements restricts the auction. Exclude only with placement-level evidence, not on reputation.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A19": {"id": "A19", "sec": "Theoretical Knowledge", "type": "mcq", "q": "GA4 consistently reports fewer conversions than Google Ads. The most likely reason is:", "opts": ["They use different attribution models and different date logic", "The GA4 tag is broken", "Someone applied a filter in GA4", "Google Ads is inflating the numbers deliberately"], "a": 0, "why": "Ads reports on click date with data-driven attribution; GA4 is session-based, last-non-direct-click. They should not match.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A20": {"id": "A20", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Why should you not make decisions on yesterday's performance today?", "opts": ["The data refreshes only once a week", "Conversion lag - conversions are reported back to the click date, so recent days always understate", "Google randomises recent data to prevent manipulation", "Yesterday's data is always inaccurate"], "a": 1, "why": "Exclude the last 3-7 days depending on the account's measured lag, and agree that convention with the client.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M01": {"id": "M01", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Offline conversion import requires you to capture and store:", "opts": ["The IP address of the visitor", "The user's email address only", "The GCLID against the lead record in the CRM", "The campaign name in a hidden form field"], "a": 2, "why": "GCLID (or WBRAID/GBRAID) captured on the form and stored against the lead. Without it there is nothing to upload against.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M02": {"id": "M02", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Enhanced Conversions for Leads is most useful when:", "opts": ["You are running Display campaigns", "The client refuses to install any tracking", "You want to increase your conversion volume artificially", "You cannot reliably capture the GCLID and need to match on hashed email or phone instead"], "a": 3, "why": "It is the fallback when GCLID capture is not feasible, not a replacement for a proper OCI setup.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M03": {"id": "M03", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Under data-driven attribution, a conversion is reported on:", "opts": ["The date of the click that led to it", "The date the campaign started", "The date of the last impression", "The date the conversion happened"], "a": 0, "why": "Click date, which is why recent days back-fill and should never be judged as final.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M05": {"id": "M05", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Brand exclusions in Performance Max are used to:", "opts": ["Exclude branded products from the feed", "Stop competitors bidding on your brand", "Prevent PMax absorbing brand traffic that should sit in a controlled search campaign", "Remove your brand from Display placements"], "a": 2, "why": "Without them, PMax claims cheap brand conversions and the headline ROAS flatters the campaign.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M06": {"id": "M06", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Custom labels in a product feed exist to:", "opts": ["Replace the product_type attribute", "Add promotional text to the listing", "Improve the product's search ranking", "Segment products by business logic such as margin, price band, bestseller or seasonality"], "a": 3, "why": "They are how you make bidding follow profit rather than revenue.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M07": {"id": "M07", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A Merchant Center 'misrepresentation' disapproval usually relates to:", "opts": ["A mismatch between the site and the feed, or missing trust and policy information on the site", "The product price being too high", "Too many products in the feed", "Image resolution being too low"], "a": 0, "why": "Usually returns/contact/policy pages, unclear pricing or feed-to-site mismatch - not a feed formatting issue.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M10": {"id": "M10", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Advantage+ Shopping's headline ROAS tends to overstate incremental performance because:", "opts": ["It counts impressions as conversions", "It excludes new customers by default", "Meta uses a different currency conversion", "It absorbs retargeting and existing demand within a single reported number"], "a": 3, "why": "Which is why the existing-customer budget cap and new-customer share are the metrics that matter.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M11": {"id": "M11", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Meta's default attribution setting is:", "opts": ["7-day click and 1-day view", "28-day click and 28-day view", "Last click across all channels", "1-day click only"], "a": 0, "why": "7-day click / 1-day view. Comparing it to a last-click backend is comparing two different questions.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M12": {"id": "M12", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The correct way to run a split test on Meta is:", "opts": ["Duplicate the ad set and change one variable", "Use the A/B test tool, which splits users rather than ad sets", "Run the variants in different weeks and compare", "Run both in the same ad set and compare ad-level data"], "a": 1, "why": "Duplicating creates auction overlap and unequal delivery, so the result is not attributable to the variable.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M13": {"id": "M13", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Under Consent Mode v2, some conversions are modelled. This means:", "opts": ["They only appear in GA4", "They are conversions from users who blocked ads", "They are estimates that cannot be matched to individual users", "They are duplicates and should be removed"], "a": 2, "why": "So platform and CRM will never reconcile exactly. Set that expectation before it becomes an argument.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M14": {"id": "M14", "sec": "Theoretical Knowledge", "type": "mcq", "q": "An ad account gets restricted. The one thing you should NOT do is:", "opts": ["Submit a request for review", "Read the specific policy cited", "Audit the landing page for the violation", "Create a replacement ad account or Business Manager"], "a": 3, "why": "Spinning up a new asset risks the entire Business Manager being flagged.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M22": {"id": "M22", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The strongest available evidence that your ads caused sales is:", "opts": ["A rising conversion rate", "Positive client feedback", "A high platform-reported ROAS", "A geo holdout or conversion lift test"], "a": 3, "why": "Everything in a dashboard is correlation. Only a holdout gives you causation.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S14": {"id": "S14", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Incrementality testing matters most on:", "opts": ["New prospecting campaigns", "Brand and retargeting campaigns", "Display campaigns", "Any campaign under 10% of budget"], "a": 1, "why": "Brand and retargeting take the most credit for demand that already existed. That is where the overstatement lives.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S16": {"id": "S16", "sec": "Theoretical Knowledge", "type": "mcq", "q": "You should agree the source of truth for reporting with a client:", "opts": ["Only if a discrepancy arises", "At the quarterly review", "After the first month, once you understand the data", "Before the first reporting cycle"], "a": 3, "why": "Agreeing it after a discrepancy appears looks like moving the goalposts, however correct you are.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S17": {"id": "S17", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The main reason to run a brand holdout test is:", "opts": ["To measure how much brand-search conversion volume is genuinely incremental to organic", "To improve Quality Score on brand keywords", "To stop competitors bidding on your brand", "To reduce spend on brand terms"], "a": 0, "why": "It answers the one brand question clients actually ask, with evidence instead of assertion.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S18": {"id": "S18", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A process you build is genuinely valuable when:", "opts": ["It is documented in detail", "It is still used after you stop enforcing it", "It saves at least an hour per week", "Every team member has been trained on it"], "a": 1, "why": "Survival without enforcement is the only real test. Everything else is a document nobody opens.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "A25": {"id": "A25", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which negative keyword match type would stop your ad for the search 'free crm software'?", "opts": ["Negative exact 'free'", "Negative phrase 'software free'", "None of these", "Negative broad 'free'"], "a": 3, "why": "Negative broad on 'free' blocks any search containing that word. Negative exact only blocks the term 'free' alone.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A26": {"id": "A26", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Auction Insights tells you:", "opts": ["Which domains you compete with, and their impression share, overlap rate and outranking share", "Your competitors' conversion rates", "The exact position your ad appeared in", "What your competitors are bidding"], "a": 0, "why": "Never their bids or their results - only relative auction presence.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A27": {"id": "A27", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A 'close variant' means Google may show your ad for a search that:", "opts": ["Is in a different language", "Has the same meaning as your keyword, including misspellings and plurals", "Contains any word from your keyword", "Is in a different country"], "a": 1, "why": "Which is why exact match is not literal and why the search terms report still matters.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A28": {"id": "A28", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In Meta, what does 'frequency' measure?", "opts": ["How often the algorithm updates delivery", "How often you refresh your creative", "Average number of times each person saw your ad", "How many ads are running in an ad set"], "a": 2, "why": "Impressions / reach. Rising frequency with falling CTR is the classic fatigue signature.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A29": {"id": "A29", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which Meta objective would you use to drive purchases on a website?", "opts": ["Awareness", "Traffic", "Engagement", "Sales"], "a": 3, "why": "Sales, optimising for the purchase event. Traffic buys cheap clicks from people who do not buy.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A30": {"id": "A30", "sec": "Theoretical Knowledge", "type": "mcq", "q": "What is a customer match (or customer list) audience?", "opts": ["An audience built by uploading your own hashed customer data", "Anyone who has visited your website", "People who match your ideal customer profile demographically", "An audience Google builds from similar advertisers"], "a": 0, "why": "Your first-party data, hashed before upload. Increasingly the most valuable targeting asset you have.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A32": {"id": "A32", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In Google Ads, what does a 'Limited by budget' status mean?", "opts": ["The bid strategy has been paused", "The campaign has spent its lifetime budget", "The campaign could get more impressions if the budget were higher", "The account payment method has failed"], "a": 2, "why": "It is an opportunity flag, not an error - but only worth acting on if the campaign is hitting its efficiency target.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "A34": {"id": "A34", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Dynamic product ads on Meta require, at minimum:", "opts": ["A synced catalog and pixel/CAPI events passing matching content IDs", "A minimum of 1,000 products", "A separate Business Manager", "A video creative for each product"], "a": 0, "why": "The content_id link between catalog and pixel is what makes them dynamic. It is also what most often breaks.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M28": {"id": "M28", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In a Shopping campaign, what actually determines which searches your product shows for?", "opts": ["The landing page content", "The keywords in the ad group", "The product feed data, primarily the title, attributes and category", "The campaign priority setting"], "a": 2, "why": "The feed is the targeting mechanism. This is why title optimisation is the highest-leverage Shopping lever.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M29": {"id": "M29", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Campaign priority settings in Shopping are used to:", "opts": ["Set the order products appear in", "Prioritise high-margin products automatically", "Decide which campaign gets budget first", "Control which campaign serves when the same product is eligible in more than one"], "a": 3, "why": "Combined with shared negatives, priority is how you tier traffic by query intent.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M30": {"id": "M30", "sec": "Theoretical Knowledge", "type": "mcq", "q": "A supplemental feed lets you:", "opts": ["Override or add attributes without editing the primary feed source", "Feed data to Meta as well as Google", "Bypass Merchant Center review", "Add a second set of products"], "a": 0, "why": "Which is what makes title testing possible without asking the client's dev team for every change.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M31": {"id": "M31", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In PMax, 'audience signals' are:", "opts": ["Hard targeting - the campaign only reaches those people", "A starting hint to speed up learning; the campaign can still go beyond them", "Only used for the Display network portion", "Automatically generated and cannot be edited"], "a": 1, "why": "A signal, not a constraint. Treating them as targeting is a very common misunderstanding.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M32": {"id": "M32", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Value rules in Google Ads let you:", "opts": ["Exclude low-value products from Shopping", "Set different bids by device", "Adjust conversion value by location, device or audience so bidding reflects real worth", "Set a minimum order value"], "a": 2, "why": "The practical route to margin-aware or new-customer-aware bidding without rebuilding the feed.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M33": {"id": "M33", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Meta's existing-customer budget cap in Advantage+ Shopping exists to:", "opts": ["Cap the frequency of ads to customers", "Prevent the campaign exiting the learning phase", "Reduce total spend", "Limit how much of the budget goes to people who have already bought"], "a": 3, "why": "It is the main lever for pushing ASC towards new-customer acquisition rather than harvesting.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "M36": {"id": "M36", "sec": "Theoretical Knowledge", "type": "mcq", "q": "An account has data-driven attribution and a 30-day conversion window. A client asks why last week's ROAS keeps changing. The answer is:", "opts": ["The currency conversion updates daily", "The platform is unreliable", "Conversions are credited back to the click date, so recent days fill in over time", "Someone is editing the campaigns"], "a": 2, "why": "Back-filling is expected. Agreeing a reporting lag convention up front prevents this conversation entirely.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "M48": {"id": "M48", "sec": "Theoretical Knowledge", "type": "mcq", "q": "Which is the best evidence that a landing page change worked?", "opts": ["Bounce rate fell", "Conversion rate went up the following week", "A controlled split test with adequate conversion volume showed a lift", "The client prefers the new page"], "a": 2, "why": "Week-on-week movement confounds with traffic mix, seasonality and everything else that changed.", "track": "both", "cat": "Theoretical Knowledge", "diff": "mid"}, "S34": {"id": "S34", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The main limitation of marketing mix modelling for a mid-sized account is:", "opts": ["It cannot include digital channels", "It requires user-level data", "It only works for TV advertising", "It needs a long history and substantial spend variation to produce reliable coefficients"], "a": 3, "why": "Below a certain spend and history, MMM produces confident-looking output with very wide real error bars.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S35": {"id": "S35", "sec": "Theoretical Knowledge", "type": "mcq", "q": "You want to prove brand search is incremental. The cleanest test is:", "opts": ["A geo-split holdout where brand campaigns are paused in matched regions", "Pause brand for a week and compare to the week before", "Compare branded organic traffic to branded paid traffic", "Compare brand ROAS to non-brand ROAS"], "a": 0, "why": "A matched geo holdout controls for time-based confounders. A before/after week does not.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S36": {"id": "S36", "sec": "Theoretical Knowledge", "type": "mcq", "q": "In a geo holdout test, the most common design mistake is:", "opts": ["Running it for too long", "Test and control regions that are not comparable in baseline, seasonality or channel mix", "Including too many regions", "Measuring backend revenue rather than platform conversions"], "a": 1, "why": "Matching is everything. Badly matched geos produce a confident number that means nothing.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S48": {"id": "S48", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The best way to know whether your process changes actually worked is:", "opts": ["Ask the team if they like them", "Check whether they are still being followed six months later without enforcement", "Count how many people were trained", "Measure time saved in the first month"], "a": 1, "why": "Survival without enforcement. Everything else measures compliance, not adoption.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "S51": {"id": "S51", "sec": "Theoretical Knowledge", "type": "mcq", "q": "The most reliable early warning that an account is about to churn is:", "opts": ["A change in engagement - slower replies, cancelled meetings, a new stakeholder appearing", "A request for a fee reduction", "A competitor pitch", "A drop in ROAS"], "a": 0, "why": "By the time they mention fees or competitors the decision is usually made. Engagement moves first.", "track": "both", "cat": "Theoretical Knowledge", "diff": "high"}, "A15": {"id": "A15", "sec": "Calculation Capability", "type": "num", "q": "Spend 250,000. Conversions 200. Revenue 900,000. What is the ROAS?", "a": 3.6, "why": "900,000 / 250,000 = 3.6.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A16": {"id": "A16", "sec": "Calculation Capability", "type": "num", "q": "CPC is 40 and conversion rate is 2.5%. What is the CPA?", "a": 1600, "why": "CPA = CPC / CVR = 40 / 0.025 = 1,600.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A17": {"id": "A17", "sec": "Calculation Capability", "type": "num", "q": "You need 100 leads at a target CPL of 800. What budget do you need?", "a": 80000, "why": "100 x 800 = 80,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A18": {"id": "A18", "sec": "Calculation Capability", "type": "num", "q": "CPM is 300 and CTR is 1.5%. What is the CPC?", "a": 20, "why": "CPC = CPM / (1,000 x CTR) = 300 / (1,000 x 0.015) = 20.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M15": {"id": "M15", "sec": "Calculation Capability", "type": "num", "q": "AOV is 2,500. COGS is 1,000. Shipping and payment fees are 300. What is the contribution margin, as a percentage?", "a": 48, "why": "(2,500 - 1,300) / 2,500 = 48%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M16": {"id": "M16", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 40%. What is the break-even ROAS?", "a": 2.5, "why": "Break-even ROAS = 1 / contribution margin = 1 / 0.40 = 2.5.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M17": {"id": "M17", "sec": "Calculation Capability", "type": "num", "q": "A client wants 40 sales a month. Close rate is 25% and lead-to-SQL is 40%. How many leads are needed per month?", "a": 400, "why": "40 / 0.25 = 160 SQLs. 160 / 0.40 = 400 leads.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M18": {"id": "M18", "sec": "Calculation Capability", "type": "num", "q": "Same client: target CAC is 12,000 and 400 leads are needed. What CPL do you need?", "a": 1200, "why": "Budget = 40 x 12,000 = 480,000. CPL = 480,000 / 400 = 1,200.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M19": {"id": "M19", "sec": "Calculation Capability", "type": "num", "q": "Backend revenue is 8,000,000 and total ad spend across all channels is 2,500,000. What is the MER?", "a": 3.2, "why": "MER = total revenue / total ad spend = 3.2. Platform-agnostic, so immune to cross-channel double counting.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "S01": {"id": "S01", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 35%. What is the break-even ROAS? (two decimal places)", "a": 2.86, "why": "1 / 0.35 = 2.857, so 2.86.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S02": {"id": "S02", "sec": "Calculation Capability", "type": "num", "q": "Monthly fee revenue is 3,000,000. Your largest client is 40% of that. Servicing that client costs 60% of its fee. If it churns, how much monthly gross profit do you lose?", "a": 480000, "why": "Fee = 1,200,000. Cost = 720,000. Gross profit lost = 480,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S03": {"id": "S03", "sec": "Calculation Capability", "type": "num", "q": "Spend rises from 2,000,000 to 2,800,000. Revenue rises from 7,000,000 to 8,400,000. What is the marginal ROAS on the additional spend?", "a": 1.75, "why": "(8,400,000 - 7,000,000) / (2,800,000 - 2,000,000) = 1,400,000 / 800,000 = 1.75.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S05": {"id": "S05", "sec": "Calculation Capability", "type": "num", "q": "Target payback period is 3 months. A customer generates 800 of contribution per month. What is the maximum CAC you can justify?", "a": 2400, "why": "3 x 800 = 2,400.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "A35": {"id": "A35", "sec": "Calculation Capability", "type": "num", "q": "Spend 180,000. Revenue 630,000. What is the ROAS?", "a": 3.5, "why": "630,000 / 180,000 = 3.5.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A36": {"id": "A36", "sec": "Calculation Capability", "type": "num", "q": "You need 250 conversions and your CVR is 4%. How many clicks do you need?", "a": 6250, "why": "250 / 0.04 = 6,250.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A37": {"id": "A37", "sec": "Calculation Capability", "type": "num", "q": "6,250 clicks at a CPC of 32. What budget do you need?", "a": 200000, "why": "6,250 x 32 = 200,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A38": {"id": "A38", "sec": "Calculation Capability", "type": "num", "q": "CPA is 1,600 and AOV is 4,800. What is the ROAS?", "a": 3, "why": "ROAS = AOV / CPA = 4,800 / 1,600 = 3.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A39": {"id": "A39", "sec": "Calculation Capability", "type": "num", "q": "Impressions 400,000. Reach 100,000. What is the frequency?", "a": 4, "why": "400,000 / 100,000 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A40": {"id": "A40", "sec": "Calculation Capability", "type": "num", "q": "Spend 90,000 at a CPM of 450. How many impressions?", "a": 200000, "why": "90,000 / 450 x 1,000 = 200,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A41": {"id": "A41", "sec": "Calculation Capability", "type": "num", "q": "Conversions rose from 80 to 104. What is the percentage increase?", "a": 30, "why": "24 / 80 = 30%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "A42": {"id": "A42", "sec": "Calculation Capability", "type": "num", "q": "Your target CPA is 900 and your CVR is 3%. What is the maximum CPC you can afford?", "a": 27, "why": "Max CPC = target CPA x CVR = 900 x 0.03 = 27.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M37": {"id": "M37", "sec": "Calculation Capability", "type": "num", "q": "AOV 3,200. COGS 1,400. Shipping and fees 400. What is the contribution margin, as a percentage?", "a": 43.75, "why": "(3,200 - 1,800) / 3,200 = 43.75%.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M38": {"id": "M38", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 25%. What is the break-even ROAS?", "a": 4, "why": "1 / 0.25 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M39": {"id": "M39", "sec": "Calculation Capability", "type": "num", "q": "Total revenue 12,000,000. Total ad spend 3,000,000. What is the MER?", "a": 4, "why": "12,000,000 / 3,000,000 = 4.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M40": {"id": "M40", "sec": "Calculation Capability", "type": "num", "q": "A client needs 60 sales a month. Lead-to-sale is 15%. How many leads per month?", "a": 400, "why": "60 / 0.15 = 400.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M41": {"id": "M41", "sec": "Calculation Capability", "type": "num", "q": "Budget 900,000 and you need 400 leads. What CPL do you need?", "a": 2250, "why": "900,000 / 400 = 2,250.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "M42": {"id": "M42", "sec": "Calculation Capability", "type": "num", "q": "Spend rose from 500,000 to 700,000; conversions rose from 250 to 310. What is the marginal CPA on the extra spend?", "a": 3333.33, "why": "200,000 / 60 = 3,333. Against a blended CPA of 2,258, the incremental spend is far more expensive.", "tol": 0.01, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M43": {"id": "M43", "sec": "Calculation Capability", "type": "num", "q": "Revenue 5,000,000 at a 40% contribution margin. Ad spend 1,600,000. What is the contribution after ad spend?", "a": 400000, "why": "5,000,000 x 0.40 = 2,000,000, minus 1,600,000 = 400,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "M44": {"id": "M44", "sec": "Calculation Capability", "type": "num", "q": "Customer LTV is 9,000 with a 45% margin. What is the maximum CAC to break even on lifetime value?", "a": 4050, "why": "9,000 x 0.45 = 4,050.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S25": {"id": "S25", "sec": "Calculation Capability", "type": "num", "q": "Contribution margin is 55%. What is the break-even ROAS? (two decimal places)", "a": 1.82, "why": "1 / 0.55 = 1.818, so 1.82.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S26": {"id": "S26", "sec": "Calculation Capability", "type": "num", "q": "Spend goes from 4,000,000 to 5,000,000. Revenue goes from 14,000,000 to 16,500,000. What is the marginal ROAS?", "a": 2.5, "why": "2,500,000 / 1,000,000 = 2.5.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S27": {"id": "S27", "sec": "Calculation Capability", "type": "num", "q": "A client's blended CAC is 3,000 with a 12-month LTV of 11,000 at 40% margin. What is the LTV:CAC ratio on a margin basis?", "a": 1.47, "why": "11,000 x 0.40 = 4,400. 4,400 / 3,000 = 1.47 - considerably weaker than the 3.7 the revenue figure suggests.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S28": {"id": "S28", "sec": "Calculation Capability", "type": "num", "q": "Portfolio fee revenue is 4,000,000 a month at an average 45% servicing cost. What is monthly gross profit?", "a": 2200000, "why": "4,000,000 x 0.55 = 2,200,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S29": {"id": "S29", "sec": "Calculation Capability", "type": "num", "q": "You must cut servicing hours 20% across a team costing 1,500,000 a month. What is the monthly saving if cost scales with hours?", "a": 300000, "why": "1,500,000 x 0.20 = 300,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S30": {"id": "S30", "sec": "Calculation Capability", "type": "num", "q": "New customers are 30% of 2,000 monthly orders. Total ad spend is 1,800,000. What is the new-customer CAC?", "a": 3000, "why": "600 new customers. 1,800,000 / 600 = 3,000. The blended figure of 900 would badly mislead.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S31": {"id": "S31", "sec": "Calculation Capability", "type": "num", "q": "Target payback is 6 months and monthly contribution per customer is 500. What is the maximum CAC?", "a": 3000, "why": "6 x 500 = 3,000.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "S32": {"id": "S32", "sec": "Calculation Capability", "type": "num", "q": "Account A: 3,000,000 spend at 3.0 ROAS. Account B: 1,000,000 spend at 6.0 ROAS. What is the combined ROAS?", "a": 3.75, "why": "(9,000,000 + 6,000,000) / 4,000,000 = 3.75. Note it is spend-weighted, not the 4.5 average of the two.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "N13": {"id": "N13", "sec": "Calculation Capability", "type": "num", "q": "Ad spend is 60,000 and ad-attributed revenue is 3,00,000. What is the ACOS, as a percentage?", "a": 20, "why": "ACOS = spend / ad revenue = 60,000 / 300,000 = 20%. It is the inverse of ROAS.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N14": {"id": "N14", "sec": "Calculation Capability", "type": "num", "q": "Ad spend 60,000. Ad revenue 2,00,000. Organic revenue 3,00,000. What is the TACOS, as a percentage?", "a": 12, "why": "TACOS = ad spend / TOTAL revenue = 60,000 / 500,000 = 12%. It shows the true dependence on paid.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N15": {"id": "N15", "sec": "Calculation Capability", "type": "num", "q": "Product price 1,200. Target ACOS 25%. CVR 4%. What is the maximum CPC you can afford?", "a": 12, "why": "Allowable cost per sale = 1,200 x 25% = 300. Max CPC = 300 x 4% = 12.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N16": {"id": "N16", "sec": "Calculation Capability", "type": "num", "q": "Impressions 80,000. CTR 1.5%. CVR 4%. CPC 30. What is the CPA?", "a": 750, "why": "1,200 clicks, 48 conversions, spend 36,000. CPA = 36,000 / 48 = 750. Or simply CPC / CVR.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N17": {"id": "N17", "sec": "Calculation Capability", "type": "num", "q": "CVR falls from 3% to 2% while CPC stays at 20. What is the new CPA?", "a": 1000, "why": "CPA = 20 / 0.02 = 1,000, up from 667. A one-point CVR drop raised CPA by half.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "mid"}, "N24": {"id": "N24", "sec": "Calculation Capability", "type": "num", "q": "AOV 4,000. Contribution margin 35%. Target is to make 500 profit per order after ad cost. What is the maximum CAC?", "a": 900, "why": "Contribution = 4,000 x 35% = 1,400. Less 500 target profit = 900 maximum CAC.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "N25": {"id": "N25", "sec": "Calculation Capability", "type": "num", "q": "Spend 3,00,000 at 4.0 ROAS. You add 1,00,000 more and total revenue becomes 14,00,000. What is the marginal ROAS on the additional spend?", "a": 2, "why": "Was 12,00,000. Now 14,00,000. (14,00,000 - 12,00,000) / 1,00,000 = 2.0 — half the average.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "N26": {"id": "N26", "sec": "Calculation Capability", "type": "num", "q": "A subscription product bills 800 a month at 70% margin, and the average customer stays 9 months. What is the maximum CAC to break even on lifetime value?", "a": 5040, "why": "800 x 0.70 x 9 = 5,040.", "tol": 0.02, "track": "both", "hint": "", "cat": "Calculation Capability", "diff": "high"}, "A02": {"id": "A02", "sec": "Strategic Mindset", "type": "mcq", "q": "Which bid strategy would you avoid on an account generating 3 conversions per month?", "opts": ["Target Impression Share", "Maximise Clicks", "Manual CPC", "Target ROAS"], "a": 3, "why": "Value-based automated bidding needs conversion volume. With 3 conversions a month it has nothing to learn from.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A14": {"id": "A14", "sec": "Strategic Mindset", "type": "mcq", "q": "A lookalike audience is best built from:", "opts": ["People who engaged with any post", "The largest customer list you can find", "All website visitors from the last 180 days", "Your highest-value customers, even if that list is relatively small"], "a": 3, "why": "Seed quality beats seed size. A lookalike of all leads inherits the quality of all leads, including the bad ones.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "M04": {"id": "M04", "sec": "Strategic Mindset", "type": "mcq", "q": "The biggest risk of running Performance Max on a lead gen account is:", "opts": ["It always costs more per click", "Lead quality dilution, with limited query-level control", "It cannot run alongside Search campaigns", "It requires a product feed"], "a": 1, "why": "Only sensible with lead scoring and OCI feeding back, plus brand exclusions and campaign-level negatives.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M08": {"id": "M08", "sec": "Strategic Mindset", "type": "mcq", "q": "Before moving an account from tCPA to tROAS, the most important prerequisite is:", "opts": ["A larger daily budget", "Verified, correctly passed conversion values", "At least 12 months of account history", "Switching all campaigns to broad match"], "a": 1, "why": "tROAS optimises to the value you send it. Wrong values means confidently optimising to the wrong thing.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M09": {"id": "M09", "sec": "Strategic Mindset", "type": "mcq", "q": "An initial tROAS target should be set based on:", "opts": ["Double the current ROAS, to create headroom", "The client's desired ROAS", "The account's trailing achieved ROAS", "The industry benchmark"], "a": 2, "why": "Set from what the account actually achieves, then step 10-15% at a time allowing relearning between moves.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M20": {"id": "M20", "sec": "Strategic Mindset", "type": "mcq", "q": "Campaign A is at 3.0 ROAS, Campaign B is at 5.0 ROAS. Should you move the whole budget to B?", "opts": ["Yes - B is clearly more efficient", "No - average ROAS says nothing about what the next rupee into B would return", "Yes, but only 50% of it", "No - you should never move budget between campaigns"], "a": 1, "why": "B may be saturated or audience-limited. Check headroom, move incrementally, measure marginal return.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M25": {"id": "M25", "sec": "Strategic Mindset", "type": "mcq", "q": "A client demands a 50% CPL reduction in 30 days and you believe it is not achievable. You should:", "opts": ["Agree, and manage expectations later", "Refuse and explain that the request is unrealistic", "State the constraint with evidence, offer the achievable trade-off, and confirm it in writing", "Agree to try, without committing to the number"], "a": 2, "why": "Name the constraint, offer the real trade-off (lower CPL at lower volume), and document what was agreed.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S04": {"id": "S04", "sec": "Strategic Mindset", "type": "mcq", "q": "In the scenario above, average ROAS fell from 3.5 to 3.0 and break-even ROAS is 2.5. What does that tell you?", "opts": ["The spend increase was too small to judge", "Break-even ROAS is the wrong metric here", "Performance is still acceptable - the average is above break-even", "The incremental spend is losing money, even though the average still looks healthy"], "a": 3, "why": "Marginal ROAS of 1.75 against a 2.5 break-even means the additional 800,000 destroyed value. The average hides it. This is the single most expensive mistake in scaling accounts.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S06": {"id": "S06", "sec": "Strategic Mindset", "type": "mcq", "q": "First-order contribution is 900 and CAC is 1,500. The first order is:", "opts": ["Profitable", "Loss-making, and only justified if repeat purchase covers the gap within an agreed payback window", "Break-even", "Impossible to assess without knowing ROAS"], "a": 1, "why": "Buying first orders at a loss is a legitimate strategy - but only with cohort data and the client's finance side agreeing the window.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S07": {"id": "S07", "sec": "Strategic Mindset", "type": "mcq", "q": "The most reliable input when forecasting the effect of a budget increase is:", "opts": ["Industry benchmark growth rates", "Last month's average CPA", "The historical marginal CPA/ROAS curve plus remaining impression share", "The client's growth target"], "a": 2, "why": "Average performance tells you nothing about what the next unit of spend returns.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S08": {"id": "S08", "sec": "Strategic Mindset", "type": "mcq", "q": "A client already holds 85% impression share on non-brand search and asks to double spend. The most likely outcome is:", "opts": ["A large drop in CPC due to increased volume", "Improved Quality Score from higher spend", "A proportional increase in conversions", "Sharply diminishing returns on search - growth has to come from other channels, audiences or geographies"], "a": 3, "why": "There is almost no headroom left. Promising linear scaling here is how accounts and relationships break.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S09": {"id": "S09", "sec": "Strategic Mindset", "type": "mcq", "q": "A client representing 40% of portfolio revenue is significantly over-serviced. Your first move is:", "opts": ["Audit where the hours actually go, then redesign scope or renegotiate the fee", "Absorb the cost - the account is too important to risk", "Hire an additional associate to cover the workload", "Reduce the service level and inform the client"], "a": 0, "why": "Understand the hours before you change headcount, service level or price. Usually the hours are in reporting and ad-hoc requests.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S10": {"id": "S10", "sec": "Strategic Mindset", "type": "mcq", "q": "Two accounts are at renewal risk within 90 days. Your first action is:", "opts": ["Improve performance as quickly as possible", "Diagnose the actual cause of dissatisfaction, which is often communication rather than performance", "Offer a fee reduction to retain them", "Assign your strongest manager to both"], "a": 1, "why": "Churn is frequently about feeling unheard or uninformed. Fixing performance without fixing that loses the account anyway.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S13": {"id": "S13", "sec": "Strategic Mindset", "type": "mcq", "q": "Deciding the Google/Meta split for a new client should start from:", "opts": ["Category search volume and intent, versus the need to create demand", "Whichever platform the client already uses", "Whichever platform your team is stronger on", "An industry-standard split such as 60/40"], "a": 0, "why": "Google captures existing demand; Meta creates it. The split is a hypothesis with a stated reallocation rule, not a formula.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S15": {"id": "S15", "sec": "Strategic Mindset", "type": "mcq", "q": "The right governing metric for an ecommerce portfolio is:", "opts": ["Total conversions reported by each platform", "Summed platform ROAS across channels", "Backend MER and new-customer CAC", "Average CPC across accounts"], "a": 2, "why": "Summed platform ROAS double counts by design. MER and new-customer CAC are what the client's P&L actually feels.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S20": {"id": "S20", "sec": "Strategic Mindset", "type": "mcq", "q": "Scope creep is best managed by:", "opts": ["Absorbing it to protect the relationship", "Charging for every additional request", "Referring to the contract when it becomes significant", "Naming the pattern early and making the trade-off visible"], "a": 3, "why": "Say yes to small things, name the pattern early on large ones, and make the trade-off visible rather than silent.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S21": {"id": "S21", "sec": "Strategic Mindset", "type": "mcq", "q": "Reducing servicing hours by 20% should start with:", "opts": ["Auditing where the hours actually go - usually reporting and ad-hoc requests", "Reducing meeting frequency with clients", "Moving accounts to junior staff", "Cutting optimisation time"], "a": 0, "why": "Cutting optimisation time is cutting the product. The hours are almost always elsewhere.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S24": {"id": "S24", "sec": "Strategic Mindset", "type": "mcq", "q": "The first two weeks of taking over a new portfolio should be spent:", "opts": ["Meeting every client to reassure them", "Building a new reporting template", "Restructuring the weakest accounts", "Diagnosing - accounts, clients, team and commercials - before changing anything material"], "a": 3, "why": "Diagnose before you act. Being able to name what you will deliberately NOT do is the senior signal.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "A31": {"id": "A31", "sec": "Strategic Mindset", "type": "mcq", "q": "You want to stop showing ads to existing customers on a prospecting campaign. You would:", "opts": ["Lower the bid on that audience", "Exclude a customer list or purchaser audience at the campaign or ad set level", "Add negative keywords", "Reduce the daily budget"], "a": 1, "why": "Exclusion, not bid adjustment. Prospecting budget spent on existing customers is not prospecting.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A33": {"id": "A33", "sec": "Strategic Mindset", "type": "mcq", "q": "Which is the best reason to split a campaign in two?", "opts": ["The campaign has too many keywords", "To make reporting look neater", "The keywords are different", "The two groups have different economics or different CPA targets"], "a": 3, "why": "Segment on economics, not on tidiness. Splitting dilutes conversion data the algorithm needs.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A44": {"id": "A44", "sec": "Strategic Mindset", "type": "mcq", "q": "Which number would you put FIRST in a client report for a lead gen account?", "opts": ["Impressions", "Click-through rate", "Cost per qualified lead against target", "Average position"], "a": 2, "why": "Lead with the business outcome. Platform metrics are supporting detail, not the headline.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A48": {"id": "A48", "sec": "Strategic Mindset", "type": "mcq", "q": "You inherit an account with no documentation. Your first week should mostly be spent:", "opts": ["Launching new tests to gather data", "Rebuilding the campaign structure", "Auditing structure, tracking, change history and what the client thinks success looks like", "Pausing the worst performers"], "a": 2, "why": "Audit before action. Rebuilding an account you do not yet understand is how good performance gets broken.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A49": {"id": "A49", "sec": "Strategic Mindset", "type": "mcq", "q": "The client asks for a change you think will hurt performance. You:", "opts": ["Do it on one campaign only, without telling them", "Do it - they are the client", "Refuse and explain why", "Explain the risk with evidence, propose a test, and do it properly if they still want it"], "a": 3, "why": "State the concern, propose a test, then execute properly if overruled. Quiet half-compliance is the worst option.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A54": {"id": "A54", "sec": "Strategic Mindset", "type": "mcq", "q": "You are asked to work on an account in a vertical you know nothing about. Day one, you:", "opts": ["Learn the customer, the buying cycle and the client's economics before touching settings", "Ask to be reassigned", "Copy a competitor's setup", "Apply the same structure you use on your other accounts"], "a": 0, "why": "Understand the business before the account. Template-applying is how accounts get structurally wrong from day one.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "M27": {"id": "M27", "sec": "Strategic Mindset", "type": "mcq", "q": "You want Smart Bidding to optimise towards qualified leads rather than form fills. You need:", "opts": ["A higher tCPA target", "Qualified-lead outcomes fed back to Google with values, via offline conversion import", "To switch to Maximise Clicks", "To exclude unqualified search terms"], "a": 1, "why": "Smart Bidding optimises to what you send it. Negatives help, but only feedback changes what it chases.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M35": {"id": "M35", "sec": "Strategic Mindset", "type": "mcq", "q": "Which is the strongest reason to keep brand search in its own campaign?", "opts": ["Brand keywords have higher Quality Scores", "So brand performance does not flatter or distort non-brand reporting and budgeting", "Google requires it", "Brand campaigns need different ad copy"], "a": 1, "why": "Reporting integrity and budget control. Blending brand into generic is how accounts look better than they are.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "M47": {"id": "M47", "sec": "Strategic Mindset", "type": "mcq", "q": "The most defensible way to set next quarter's target is:", "opts": ["Add 20% to last quarter", "Model from marginal returns and headroom, present a range, and state the assumptions", "Use the client's board target", "Match the category benchmark"], "a": 1, "why": "A range with assumptions is honest and defensible. A single number is a hostage.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M49": {"id": "M49", "sec": "Strategic Mindset", "type": "mcq", "q": "You are asked for one metric to judge an ecommerce account's health. You pick:", "opts": ["Total conversions", "Average CPC", "Platform ROAS", "MER, alongside new-customer share"], "a": 3, "why": "MER reflects the P&L. New-customer share tells you whether the growth engine is actually running.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M51": {"id": "M51", "sec": "Strategic Mindset", "type": "mcq", "q": "A PMax campaign launched three weeks ago and CPA looks excellent. Before celebrating, check:", "opts": ["Whether it has exited the learning period", "Whether it is cannibalising brand and existing search conversions", "Whether the asset group has enough creative", "Whether the budget is fully spending"], "a": 1, "why": "PMax's early wins are frequently conversions your search campaigns were already getting.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M53": {"id": "M53", "sec": "Strategic Mindset", "type": "mcq", "q": "You disagree with the client's in-house team on strategy, and they outrank you in the room. You:", "opts": ["Escalate to their manager", "Agree publicly and do it your way", "Defer entirely", "Understand their reasoning, state your position with evidence and a cost estimate, propose a test, document the outcome"], "a": 3, "why": "They may have context you lack - stock, margin, a board commitment. Propose a test rather than win an argument.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M56": {"id": "M56", "sec": "Strategic Mindset", "type": "mcq", "q": "A client is going quiet - slower replies, fewer meetings, no new briefs. You:", "opts": ["Offer a discount", "Wait for them to raise anything that is wrong", "Proactively ask for a conversation about how the relationship is going", "Send more detailed reports"], "a": 2, "why": "Silence is the most reliable churn signal there is. Waiting to be told is how accounts are lost without warning.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "M59": {"id": "M59", "sec": "Strategic Mindset", "type": "mcq", "q": "Your account's performance is fine, but the client's business is struggling for reasons outside media. You:", "opts": ["Keep reporting on media metrics - that is your scope", "Raise it directly, connect your work to their actual problem, and adjust what you optimise for", "Reduce spend without telling them", "Wait for them to bring it up"], "a": 1, "why": "The account being fine is not the same as the client being fine. Managers who notice the difference keep clients.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S37": {"id": "S37", "sec": "Strategic Mindset", "type": "mcq", "q": "A forecast you present should always include:", "opts": ["Last year's actuals only", "A single committed number the client can plan against", "A range, the assumptions behind it, and what would invalidate it", "The best case, to secure budget approval"], "a": 2, "why": "Ranges with assumptions survive contact with reality. Point forecasts become the number you are judged against.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S38": {"id": "S38", "sec": "Strategic Mindset", "type": "mcq", "q": "Which portfolio-level metric best predicts revenue risk over the next two quarters?", "opts": ["Total spend under management", "Number of active campaigns", "Average ROAS across accounts", "Client concentration and account tenure alongside satisfaction signals"], "a": 3, "why": "Concentration is the risk that actually kills agencies. Performance metrics are lagging indicators of it.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S40": {"id": "S40", "sec": "Strategic Mindset", "type": "mcq", "q": "You inherit a portfolio and one account is losing money on servicing but is the founder's personal relationship. You:", "opts": ["Leave it alone", "Quantify the loss, present it with options, and let the commercial owner decide with real numbers", "Reduce the service level quietly", "Recommend resigning the account"], "a": 1, "why": "Your job is to make the trade-off visible with numbers, not to make the relationship decision unilaterally.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S43": {"id": "S43", "sec": "Strategic Mindset", "type": "mcq", "q": "Your team is at capacity and sales wants to sign two more accounts. You:", "opts": ["Model the capacity honestly, show what would have to give, and put the decision in front of the commercial owner", "Accept and work out the details later", "Accept but reduce service on existing accounts", "Say no until you can hire"], "a": 0, "why": "Make the trade-off explicit. Quietly absorbing it is how service quality decays without anyone deciding to let it.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S44": {"id": "S44", "sec": "Strategic Mindset", "type": "mcq", "q": "The single most useful thing to do in the first two weeks of owning a new portfolio is:", "opts": ["Rebuild the weakest account", "Talk to every client and every team member, and read the last two quarters of reporting", "Introduce a new reporting template", "Meet the biggest client"], "a": 1, "why": "Diagnosis, breadth first. Acting on the first account you look at is how you solve the wrong problem well.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S45": {"id": "S45", "sec": "Strategic Mindset", "type": "mcq", "q": "A pitch prospect asks for a guaranteed CPA before you have seen their data. You:", "opts": ["Guarantee it and manage expectations after winning", "Give a conservative number to stay in the running", "Explain what you would need to see, give a directional range with conditions, and be clear about what you will not guarantee", "Refuse to discuss numbers"], "a": 2, "why": "A guarantee made without data is a client conflict scheduled for month three.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "S50": {"id": "S50", "sec": "Strategic Mindset", "type": "mcq", "q": "A client wants to move to a performance-based fee tied to ROAS. Your first concern is:", "opts": ["Whether the fee would be higher or lower", "Whether competitors offer the same", "Whether the team can hit the number", "Whether you control the variables it depends on - site, pricing, stock, product"], "a": 3, "why": "Being paid on an outcome you only partly control is how agencies lose money on their best work.", "track": "both", "cat": "Strategic Mindset", "diff": "high"}, "N18": {"id": "N18", "sec": "Strategic Mindset", "type": "mcq", "q": "A client's CPL target is 500 and you are at 650, with a 2% conversion rate. Which combination is most likely to close the gap?", "opts": ["Raise bids by 30% to win more auctions", "Pause the weakest ad groups, tighten targeting, and work on landing page conversion rate", "Increase the budget to gather more conversion data", "Switch to an impression share bidding strategy"], "a": 1, "why": "CPL = CPC / CVR. With CVR at 2%, the biggest available lever is conversion rate, not the auction.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "N19": {"id": "N19", "sec": "Strategic Mindset", "type": "mcq", "q": "Prospecting is at 2.2 ROAS on 1,00,000 spend; retargeting is at 6.0 on 30,000. Blended target is 3.0. What should you do?", "opts": ["Cut both budgets until efficiency improves", "Shift most of the budget into retargeting because its ROAS is higher", "Keep investing in prospecting — retargeting only converts demand that prospecting created, and it will not scale on its own", "Pause prospecting since it is below the 3.0 target"], "a": 2, "why": "Retargeting ROAS is borrowed from prospecting. Starving the top of the funnel collapses both within weeks.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "N20": {"id": "N20", "sec": "Strategic Mindset", "type": "mcq", "q": "You have to choose ONE thing to fix on an account with weak CTR, weak CVR and weak AOV. How do you decide?", "opts": ["Fix AOV because it affects revenue directly", "Fix whichever is furthest from the industry benchmark", "Fix them in the order they appear in the funnel", "Work out which one, if improved by a realistic amount, moves the business metric most"], "a": 3, "why": "Prioritise by expected impact, not by position in the funnel or by distance from a benchmark.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "N21": {"id": "N21", "sec": "Strategic Mindset", "type": "mcq", "q": "A client asks you to cut spend by 30% but keep lead volume flat. What is the honest answer?", "opts": ["Say it requires a roughly 43% improvement in efficiency, name where that could realistically come from, and be clear about what is achievable in the timeframe", "Refuse, because it is impossible", "Agree, then explain later if it does not work", "Agree and try your best"], "a": 0, "why": "Quantify what is being asked before answering it. Same volume on 70% of budget needs efficiency up by 1/0.7.", "track": "both", "cat": "Strategic Mindset", "diff": "mid"}, "A08": {"id": "A08", "sec": "Problem Solving Approach", "type": "mcq", "q": "You need to make 300 changes across an account. The safest approach is:", "opts": ["Make them in the UI one at a time so you can check each one", "Export a backup, make the changes in Google Ads Editor, run the error check, post, then verify in change history", "Use a script so it happens instantly", "Ask the client to approve each change first"], "a": 1, "why": "The backup and the post-change verification are the parts people skip, and they are the parts that matter.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A21": {"id": "A21", "sec": "Problem Solving Approach", "type": "mcq", "q": "CPL has risen 60% over eight weeks. Which do you check FIRST?", "opts": ["The client's landing page design", "Competitor ad copy", "Change history and conversion tracking", "Whether to increase bids"], "a": 2, "why": "Check what changed and whether measurement is intact before forming any theory. Almost every wasted week starts by skipping this.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A22": {"id": "A22", "sec": "Problem Solving Approach", "type": "mcq", "q": "A search term has spent 40,000 across three months with zero conversions. You should:", "opts": ["Ignore it - three months is too short to judge", "Add it as a negative immediately", "Increase the bid to give it a fair chance", "Check whether the intent is genuinely irrelevant, then negative it if so"], "a": 3, "why": "Usually a negative, but not automatically: a high-intent term with a broken landing page needs a different fix.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A23": {"id": "A23", "sec": "Problem Solving Approach", "type": "mcq", "q": "A test is trending negative on day 4 of a planned 14-day run. You should:", "opts": ["Let it run unless it is causing real harm - day 4 is noise", "Double the budget to reach significance faster", "Change one variable and continue", "Stop it immediately to limit the damage"], "a": 0, "why": "Stopping early is how you learn nothing. Have a pre-agreed harm threshold, and hold the line otherwise.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A24": {"id": "A24", "sec": "Problem Solving Approach", "type": "mcq", "q": "The client wants a report at 5pm. At 4:45 you spot an error in the data. You:", "opts": ["Send it with the error, since the trend is still roughly right", "Tell them it will be 30 minutes late and why", "Remove the affected section without mentioning it", "Send it on time and correct it tomorrow"], "a": 1, "why": "Late and correct beats on-time and wrong. How someone handles this predicts how they handle a real mistake.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M21": {"id": "M21", "sec": "Problem Solving Approach", "type": "mcq", "q": "Google and Meta together report more revenue than the client's backend shows. This indicates:", "opts": ["Fraud in one of the accounts", "The backend is under-reporting", "Double counting and overlapping attribution between the platforms", "A currency error"], "a": 2, "why": "Both platforms claim the same conversion. It is why MER exists as a governing metric.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "M23": {"id": "M23", "sec": "Problem Solving Approach", "type": "mcq", "q": "CPL is up 45%, volume is flat, and lead-to-SQL has fallen from 32% to 19%. The most likely driver is:", "opts": ["A change in traffic quality or source mix", "Seasonality", "The landing page has slowed down", "Bids are set too low"], "a": 0, "why": "A simultaneous CPL rise and SQL-rate fall points at what kind of traffic you are buying, not at bid levels.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "M24": {"id": "M24", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your associate made a bulk edit that broke pacing across four campaigns. Your first action is:", "opts": ["Escalate it to HR", "Contain the damage, then speak to them directly and privately", "Fix it yourself and say nothing to avoid discouraging them", "Raise it in the next team meeting as a learning example"], "a": 1, "why": "Contain first, then a direct private conversation. Silence teaches nothing; public correction teaches fear.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M26": {"id": "M26", "sec": "Problem Solving Approach", "type": "mcq", "q": "You are asked to present the numbers in a way that flatters performance. You:", "opts": ["Do it once and raise it internally afterwards", "Present both versions and let the client choose", "Do it - the client relationship comes first", "Decline, and offer a fair comparison period and honest framing instead"], "a": 3, "why": "Credibility is the asset. Flattered numbers create a bigger problem the following month.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "S11": {"id": "S11", "sec": "Problem Solving Approach", "type": "mcq", "q": "An associate is consistently underutilised. The right response is:", "opts": ["Move them to a different team", "Give them more shadowing time", "Redistribute work and give them owned scope with a review layer", "Wait until the portfolio grows"], "a": 2, "why": "Underutilisation is a delegation failure, not a capability failure. Owned scope with review is how people grow.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S12": {"id": "S12", "sec": "Problem Solving Approach", "type": "mcq", "q": "A manager is technically strong but defensive with clients. You should:", "opts": ["Accept it, because the technical work is what matters", "Pair them permanently with someone who handles the calls", "Remove them from all client contact", "Coach on the specific behaviour with observed calls, clear expectations and a timeline"], "a": 3, "why": "Coach the behaviour with evidence, not the personality. Be willing to move them if it does not change.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S19": {"id": "S19", "sec": "Problem Solving Approach", "type": "mcq", "q": "A hire that does not work out is most often explained by:", "opts": ["The candidate misrepresenting themselves", "Bad luck", "A signal the interviewer noticed but did not probe", "Poor onboarding"], "a": 2, "why": "Almost always there was a moment of doubt that nobody chased. That is what the must-pass gate is for.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S22": {"id": "S22", "sec": "Problem Solving Approach", "type": "mcq", "q": "In a pitch, when you do not know the answer to a technical question you should:", "opts": ["Give your best guess confidently", "Say you do not know, say how you would find out, and commit to a specific follow-up time", "Redirect to a topic you know well", "Defer to a colleague and move on"], "a": 1, "why": "A senior person who cannot say 'I do not know' is a liability in front of clients. Then actually follow up.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "S23": {"id": "S23", "sec": "Problem Solving Approach", "type": "mcq", "q": "An underperforming team member who is well-liked should be:", "opts": ["Given a smaller portfolio indefinitely", "Given more time, since morale matters", "Given explicit expectations, a timeline and support - and managed out if it does not change", "Moved quietly to another team"], "a": 2, "why": "Tolerating it is a decision that costs the rest of the team. Clarity and a timeline is the kind version.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "A43": {"id": "A43", "sec": "Problem Solving Approach", "type": "mcq", "q": "A campaign's CTR doubled but conversions did not move. The most likely explanation is:", "opts": ["The tracking broke at the same time", "The new ad attracts more clicks but not more qualified intent", "Google is throttling the campaign", "The budget is too low"], "a": 1, "why": "Clickbait improves CTR and destroys CVR. Worth checking tracking, but the copy is the usual culprit.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A45": {"id": "A45", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your Meta ad set spent 40,000 and reports 20 purchases. Shopify shows 13 from Meta. You should:", "opts": ["Report the average of the two", "Stop using Shopify's reporting", "Report the 20 - it is the platform's own data", "Report the 13 and explain the attribution difference"], "a": 3, "why": "Backend is the source of truth; the platform number is directional. Explaining the gap is part of the job.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A46": {"id": "A46", "sec": "Problem Solving Approach", "type": "mcq", "q": "A 'conversion' in your Google Ads account is counting both form fills AND phone clicks. This means:", "opts": ["Your CPA is a blend of two different actions and may hide a problem in one of them", "The account is set up incorrectly and must be rebuilt", "Google will automatically separate them", "Nothing - both are leads"], "a": 0, "why": "Blended conversion actions are one of the commonest reasons a CPA looks fine while one channel quietly fails.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A47": {"id": "A47", "sec": "Problem Solving Approach", "type": "mcq", "q": "A campaign's spend dropped to near zero overnight with no changes made. First check:", "opts": ["Competitor activity", "Billing status, ad disapprovals and whether the campaign or ad group is still enabled", "The bid strategy target", "The landing page speed"], "a": 1, "why": "Billing failures and disapprovals cause more sudden stops than any auction dynamic.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A50": {"id": "A50", "sec": "Problem Solving Approach", "type": "mcq", "q": "You realise you have been reporting a metric incorrectly for two months. You:", "opts": ["Tell your manager immediately with the corrected numbers and the impact", "Wait until the quarterly review to raise it", "Ask a colleague whether anyone is likely to notice", "Correct it going forward and say nothing about the past"], "a": 0, "why": "Immediate disclosure with the corrected numbers. The delay is what damages trust, not the error.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A51": {"id": "A51", "sec": "Problem Solving Approach", "type": "mcq", "q": "Peak sale weekend and the client's site goes down for three hours. You:", "opts": ["Leave campaigns running - the traffic will return", "Pause or heavily throttle spend, alert the client, then restart gradually", "Pause everything permanently and wait for instructions", "Increase bids afterwards to make up lost ground"], "a": 1, "why": "Contain, communicate, restart gradually. Then quantify the loss and set up an uptime alert.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A52": {"id": "A52", "sec": "Problem Solving Approach", "type": "mcq", "q": "Your manager asks you to do something you are fairly sure is wrong. You:", "opts": ["Escalate to their manager", "Do it as instructed", "Ask a question to understand the reasoning, state your concern once with evidence, then commit either way", "Do it slowly and hope it gets cancelled"], "a": 2, "why": "Understand first, disagree once and clearly, then commit. Passive resistance is the worst of both.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "A53": {"id": "A53", "sec": "Problem Solving Approach", "type": "mcq", "q": "A test you designed is showing a clear winner after 3 days. You:", "opts": ["Stop the test and start a new one", "Extend the test indefinitely", "Roll out the winner immediately", "Check whether the sample and the conversion lag justify a conclusion before acting"], "a": 3, "why": "Three days is rarely enough. Check conversions, not clicks, and account for lag before calling it.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M34": {"id": "M34", "sec": "Problem Solving Approach", "type": "mcq", "q": "You want to test whether Audience Network placements are genuinely low quality. You should:", "opts": ["Look at the placement breakdown for delivery, CPA and downstream quality before excluding anything", "Ask Meta support", "Exclude it permanently - it is well known to be poor", "Exclude it and compare overall CPA before and after"], "a": 0, "why": "Check the breakdown first. Reflexive exclusion on reputation costs cheap inventory for no evidenced reason.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M45": {"id": "M45", "sec": "Problem Solving Approach", "type": "mcq", "q": "Blended ROAS is flat but new-customer CAC has risen 40%. What is most likely happening?", "opts": ["The tracking is broken", "Competitors have entered the market", "Nothing - blended ROAS is the metric that matters", "Spend has shifted towards retargeting and existing customers, propping up the blended number"], "a": 3, "why": "The classic silent failure: the account looks stable while the acquisition engine stalls.", "track": "both", "cat": "Problem Solving Approach", "diff": "high"}, "M46": {"id": "M46", "sec": "Problem Solving Approach", "type": "mcq", "q": "You have 40 conversions on variant A and 33 on variant B after two weeks. You should:", "opts": ["Recognise this is within noise and either run longer or accept no difference was found", "Roll out B because it had a better CTR", "Split budget 70/30 towards A", "Roll out A"], "a": 0, "why": "At these volumes the difference is not distinguishable from chance. Declaring a winner here is how false learnings spread.", "track": "both", "cat": "Problem Solving Approach", "diff": "mid"}, "M50": {"id": "M50", "sec": "Problem Solving Approach", "type": "mcq", "q": "Lead volume is stable but sales say close rates halved. Nothing changed in the account. First move:", "opts": ["Get the actual lead records and review them with sales to find what changed in the mix", "Lower CPL targets",
